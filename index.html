function setupDPControls(video) {
  const controls = document.getElementById('dpControls');
  if(!controls) return;

  // Click video to toggle play
  video.addEventListener('click', function(){ video.paused ? video.play() : video.pause(); });

  // Progress bar seek — 使用正确的 HLS seek 方式
  var progressWrap = document.getElementById('dpProgressWrap');
  if(progressWrap) {
    var _isSeeking = false;
    function seekTo(e) {
      var rect = progressWrap.getBoundingClientRect();
      var pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      if(video.duration && isFinite(video.duration)) {
        _isSeeking = true;
        var seekTime = pct * video.duration;
        // 先暂停播放避免声画不同步
        var wasPlaying = !video.paused;
        video.pause();
        // 设置目标时间
        video.currentTime = seekTime;
        // 通知HLS.js从新位置加载分片
        if(_hlsInstance) {
          _hlsInstance.startLoad(seekTime);
        }
        // 等待 seeked 事件后再恢复播放
        function onSeeked() {
          _isSeeking = false;
          video.removeEventListener('seeked', onSeeked);
          if (wasPlaying) video.play();
        }
        video.addEventListener('seeked', onSeeked);
        // 超时保护：3秒内没有 seeked 事件也恢复播放
        setTimeout(function() {
          if (_isSeeking) {
            _isSeeking = false;
            video.removeEventListener('seeked', onSeeked);
            if (wasPlaying) video.play();
          }
        }, 3000);
        // 立即更新进度条UI
        var playBar = document.getElementById('dpPlayBar');
        if(playBar) playBar.style.width = (pct*100)+'%';
        var timeEl = document.getElementById('dpTime');
        if(timeEl) timeEl.textContent = fmtTime(seekTime) + ' / ' + fmtTime(video.duration);
      }
    }
    var dragging = false;
    progressWrap.addEventListener('mousedown', function(e){ dragging=true; seekTo(e); });
    document.addEventListener('mousemove', function(e){ if(dragging) seekTo(e); });
    document.addEventListener('mouseup', function(){ dragging=false; });
    progressWrap.addEventListener('touchstart', function(e){ dragging=true; seekTo(e.touches[0]); }, {passive:true});
    progressWrap.addEventListener('touchmove', function(e){ if(dragging) seekTo(e.touches[0]); }, {passive:true});
    progressWrap.addEventListener('touchend', function(){ dragging=false; }, {passive:true});
  }

  // Video ended -> trigger auto next
  video.addEventListener('ended', function(){ triggerAutoNext(); });

  // Double-click fullscreen
  video.addEventListener('dblclick', function(){ toggleDPFullscreen(); });
}

function startDPUpdate(video) {
  if(_dpUpdateTimer) clearInterval(_dpUpdateTimer);
  // 缓冲状态初始显示后自动隐藏的计时器
  var _bufStatusShownAt = Date.now();
  var _bufStatusAutoHidden = false;
  _dpUpdateTimer = setInterval(function(){
    if(!video || !video.parentNode) { clearInterval(_dpUpdateTimer); return; }
    var dur = video.duration || 0;
    var cur = video.currentTime || 0;

    // Update play bar
    var playBar = document.getElementById('dpPlayBar');
    if(playBar && dur > 0) playBar.style.width = (cur/dur*100)+'%';

    // Update buffer bar — show maximum buffered point
    var bufBar = document.getElementById('dpBufferBar');
    if(bufBar && dur > 0 && video.buffered.length > 0) {
      var bufEnd = 0;
      for(var i=0; i<video.buffered.length; i++){
        if(video.buffered.end(i) > bufEnd) bufEnd = video.buffered.end(i);
      }
      bufBar.style.width = (bufEnd/dur*100)+'%';

      // Update buffer status text (但跟随UI自动隐藏系统)
      var dot = document.getElementById('dpBufferDot');
      var txt = document.getElementById('dpBufferText');
      var statusEl = document.getElementById('dpBufferStatus');
      var bufPct = Math.floor(bufEnd/dur*100);
      var aheadSec = Math.max(0, Math.floor(bufEnd - cur));
      if(bufPct >= 99) {
        if(dot) dot.className = 'dp-buffer-dot ready';
        if(txt) txt.textContent = '已全部缓冲 100%';
      } else {
        if(dot) dot.className = 'dp-buffer-dot buffering';
        if(txt) txt.textContent = '缓冲 '+bufPct+'% · 预载'+aheadSec+'s';
      }
      // 缓冲状态跟随UI自动隐藏 — 不再单独控制opacity
      // 由 _uiAllEls 中的 .dp-buffer-status 和 autohide class 统一管理
    }

    // Update time
    var timeEl = document.getElementById('dpTime');
    if(timeEl) timeEl.textContent = fmtTime(cur) + ' / ' + fmtTime(dur);

    // Update play button
    var playBtn = document.getElementById('dpPlayBtn');
    if(playBtn) playBtn.innerHTML = video.paused
      ? '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

    // Near-end detection for auto-next
    if(dur > 120 && cur > 60 && (dur - cur) < 2 && !video.paused) triggerAutoNext();
  }, 500);
}

function fmtTime(s) {
  if(!s || isNaN(s)) return '00:00';
  s = Math.floor(s);
  var h = Math.floor(s/3600);
  var m = Math.floor((s%3600)/60);
  var ss = s%60;
  if(h > 0) return h+':'+(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
  return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
}

function toggleDPFullscreen() {

// === 全屏退出修复：彻底解决退出视频全屏后网页仍然全屏的问题 ===
var _fsStack = []; // 记录全屏层级
function forceExitAllFullscreen() {
  try { if (document.exitFullscreen) document.exitFullscreen().catch(function(){}); } catch(e) {}
  try { if (document.webkitExitFullscreen) document.webkitExitFullscreen(); } catch(e) {}
  try { if (document.msExitFullscreen) document.msExitFullscreen(); } catch(e) {}
  try { if (document.mozCancelFullScreen) document.mozCancelFullScreen(); } catch(e) {}
}
function onFullscreenChanged() {
  var fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || document.mozFullScreenElement;
  updateFsBtn();
  if (fsEl) {
    _fsStack.push(fsEl);
  } else {
    // 全屏已退出，但可能还有残留的全屏层级
    _fsStack = [];
    // 延迟再检查一次，确保彻底退出
    setTimeout(function() {
      var stillFs = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || document.mozFullScreenElement;
      if (stillFs) {
        forceExitAllFullscreen();
      }
    }, 100);
    // 再次延迟检查（有些浏览器/iframe退出较慢）
    setTimeout(function() {
      var stillFs = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || document.mozFullScreenElement;
      if (stillFs) {
        forceExitAllFullscreen();
      }
    }, 500);
  }
}
document.addEventListener('fullscreenchange', onFullscreenChanged);
document.addEventListener('webkitfullscreenchange', onFullscreenChanged);
document.addEventListener('mozfullscreenchange', onFullscreenChanged);
document.addEventListener('MSFullscreenChange', onFullscreenChanged);

// 监听iframe内部的全屏变化消息
window.addEventListener('message', function(e) {
  try {
    var data = e.data;
    if (typeof data === 'string') {
      try { data = JSON.parse(data); } catch(ex) { return; }
    }
    if (!data || typeof data !== 'object') return;
    var evtType = (data.type || data.event || data.action || '').toLowerCase();
    if (evtType === 'exitfullscreen' || evtType === 'fullscreenchange' || evtType === 'fullscreen_exit' || evtType === 'webkitfullscreenchange') {
      forceExitAllFullscreen();
    }
  } catch(ex) {}
});

// 监听iframe内video元素的全屏退出（通过轮询检测）
var _iframeFsCheckTimer = null;
function startIframeFsWatch() {
  if (_iframeFsCheckTimer) return;
  _iframeFsCheckTimer = setInterval(function() {
    var mask = document.getElementById('modalMask');
    if (!mask || !mask.classList.contains('show')) { clearInterval(_iframeFsCheckTimer); _iframeFsCheckTimer = null; return; }
    // 检查iframe内部是否有全屏元素
    try {
      var iframe = document.querySelector('.player-area iframe');
      if (iframe && iframe.contentDocument) {
        var iframeFs = iframe.contentDocument.fullscreenElement || iframe.contentDocument.webkitFullscreenElement;
        // 如果iframe内没有全屏元素，但父页面还在全屏，退出父页面全屏
        if (!iframeFs) {
          var parentFs = document.fullscreenElement || document.webkitFullscreenElement;
          if (parentFs && parentFs !== document.getElementById('modalBox') && parentFs !== document.getElementById('playerArea')) {
            forceExitAllFullscreen();
          }
        }
      }
    } catch(e) { /* cross-origin, ignore */ }
  }, 1000);
}

// 监听resize事件 - 当用户按ESC退出全屏时浏览器会触发resize

      if (fsEl) {

// === Override playerIframe to support direct mode ===
var _origPlayerIframe = playerIframe;
playerIframe = function(url) {
  if(_directMode) {
    return playerDirectHTML(url);
  }
  return _origPlayerIframe(url);
};

// After iframe/direct content is inserted, init direct player if needed
var _origPlayEp2 = playEp;
var _directInitTimer = null; // 防止重复初始化
playEp = function(r, i, btn) {
  // 先清理上一个播放器
  destroyHls();
  if (_directInitTimer) { clearTimeout(_directInitTimer); _directInitTimer = null; }
  _origPlayEp2(r, i, btn);
  // playerArea.innerHTML 被替换了，重新插入检测层
  if (_playerUIActive) _ensureDetectOverlay();
  if(_directMode) {
    var url = _playData[r] && _playData[r].episodes[i] ? _playData[r].episodes[i].url : '';
    if(url) {
      initDirectPlayer(url);
    }
  }
};

// === 统一的播放器UI自动隐藏系统（document级别，iframe和直连模式通用） ===
var _uiHideTimer = null;
var _uiAllEls = '.p-bottom-btns,.dp-mode-btn,.p-research-btn,.p-top,.p-open-btn,.dp-buffer-status';
var _playerUIActive = false;

function _getDetectOverlay() {
  return document.getElementById('uiDetectOverlay');
}

function _showPlayerUI() {
  // 显示所有浮动按钮
  document.querySelectorAll(_uiAllEls).forEach(function(b){ b.classList.remove('autohide'); });
  // 如果是直连模式，也显示进度条
  var dpCtrl = document.getElementById('dpControls');
  if (dpCtrl) dpCtrl.classList.add('show');
  // 检测层变为透传，让用户可以操作视频/iframe
  var ov = _getDetectOverlay();
  if (ov) ov.style.pointerEvents = 'none';
  // 重置隐藏定时器
  clearTimeout(_uiHideTimer);
  _uiHideTimer = setTimeout(_hidePlayerUI, 3500);
}

function _hidePlayerUI() {
  // 直连模式下，视频暂停时不隐藏
  if (_directMode && _hlsVideo && _hlsVideo.paused) return;
  document.querySelectorAll(_uiAllEls).forEach(function(b){ b.classList.add('autohide'); });
  var dpCtrl = document.getElementById('dpControls');
  if (dpCtrl) dpCtrl.classList.remove('show');
  var sm = document.getElementById('dpSpeedMenu'); if(sm) sm.classList.remove('show');
  // 检测层重新激活，捕获下次鼠标移动
  var ov = _getDetectOverlay();
  if (ov) ov.style.pointerEvents = 'auto';
}

function _ensureDetectOverlay() {
  if (_getDetectOverlay()) return;
  var pa = document.getElementById('playerArea');
  if (!pa) return;
  var ov = document.createElement('div');
  ov.id = 'uiDetectOverlay';
  ov.style.cssText = 'position:absolute;inset:0;z-index:2147483646;pointer-events:auto;background:transparent;cursor:default;';
  // 鼠标移动 → 显示控件
  ov.addEventListener('mousemove', function(){ if(_playerUIActive) _showPlayerUI(); });
  ov.addEventListener('touchstart', function(e){
    if (!_playerUIActive) return;
    _showPlayerUI();
  }, {passive:true});
  // 点击穿透：第一次点击显示控件后，pointer-events已变none，后续点击直接到视频/iframe
  pa.appendChild(ov);
}

function startPlayerUIAutoHide() {
  _playerUIActive = true;
  _ensureDetectOverlay();
  _showPlayerUI();
}

function stopPlayerUIAutoHide() {
  _playerUIActive = false;
  clearTimeout(_uiHideTimer);
  document.querySelectorAll(_uiAllEls).forEach(function(b){ b.classList.remove('autohide'); });
  var dpCtrl = document.getElementById('dpControls');
  if (dpCtrl) dpCtrl.classList.add('show');
  var ov = _getDetectOverlay();
  if (ov) ov.remove();
}

// document级别也监听——捕获检测层之外区域的交互（鼠标移动/触摸）
// 在播放器区域内的任何鼠标移动都应该触发UI显示（不仅仅是控件上方）
document.addEventListener('mousemove', function(e) {
  if (!_playerUIActive) return;
  // 任何在播放器modal内的鼠标移动都触发UI显示
  if (e.target.closest('.modal-mask,.modal-box,.player-area,.direct-video,.p-top,.p-next-btn,.p-open-btn,.p-fs-btn,.dp-mode-btn,.p-research-btn,.dp-controls,.dp-btn,.p-side,.p-back,#dpVideo,#uiDetectOverlay,#adBlockOverlay')) {
    _showPlayerUI();
  }
}, true);
document.addEventListener('touchstart', function(e) {
  if (!_playerUIActive) return;
  // 在播放器modal内的任何触摸都触发UI显示
  if (e.target.closest('.modal-mask,.modal-box,.player-area,.direct-video,.dp-controls,.dp-btn,.dp-progress-wrap,.dp-speed,.dp-vol-wrap,.dp-speed-wrap,.dp-speed-menu,.p-next-btn,.dp-mode-btn,.p-research-btn,.p-top,.p-back,.p-open-btn,.p-fs-btn,.dp-buffer-status,.p-side,.p-pill,.p-ep,#dpVideo,#uiDetectOverlay,#adBlockOverlay')) {
    _showPlayerUI(); return;
  }
}, {capture:true, passive:true});
document.addEventListener('touchmove', function(e) {
  if (!_playerUIActive) return;
  if (e.target.closest('.modal-mask,.modal-box,.player-area')) _showPlayerUI();
}, {capture:true, passive:true});

var _origOpenPlayer2 = window.openPlayer;
window.openPlayer = function(item) {
  _origOpenPlayer2(item);
  requestAnimationFrame(function(){
    var mb = document.getElementById('modalBox');
    // Add mode toggle button
    if(!document.getElementById('dpModeBtn') && mb){
      var btn = document.createElement('button');
      btn.id = 'dpModeBtn';
      btn.onclick = function(){ setDirectMode(!_directMode); };
      mb.appendChild(btn);
      updateModeBtn();
    }
    // Add re-search button (above mode button)
    if(!document.getElementById('pResearchBtn') && mb){
      var rsBtn = document.createElement('button');
      rsBtn.id = 'pResearchBtn';
      rsBtn.className = 'p-research-btn';
      rsBtn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>重新搜索';
      rsBtn.onclick = function(){ reSearchFromPlayer(); };
      mb.appendChild(rsBtn);
    }
    // Fullscreen button is now in the HTML template inside .p-bottom-btns
    // 初始化直连播放器
    if(_directMode) {
      var firstUrl = '';
      if(_playData.length && _playData[_curRoute] && _playData[_curRoute].episodes.length) {
        var epIdx = _curEpIndex || 0;
        firstUrl = _playData[_curRoute].episodes[epIdx] ? _playData[_curRoute].episodes[epIdx].url : _playData[_curRoute].episodes[0].url;
      }
      if(firstUrl && document.getElementById('dpVideo')) {
        initDirectPlayer(firstUrl);
      }
    }
    // 启动统一自动隐藏
    startPlayerUIAutoHide();
  });
};

// Cleanup on close
var _origClosePlayer2 = window.closePlayer;
window.closePlayer = function() {
  stopPlayerUIAutoHide();
  destroyHls();
  _origClosePlayer2();
  _playerOpen = false;
  if (_imgFetchQueue.length > 0 && !_imgFetchRunning) {
    runImageFetcher();
  }
};

// === KEYBOARD & INIT ===
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
    if(fsEl){ (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); return; }
    closePlayer();cancelAutoNextCountdown();document.getElementById('historyMask').classList.remove('show');document.getElementById('settingsMask').classList.remove('show');
  }
  // Direct player keyboard shortcuts
  if(_directMode && _hlsVideo){
    if(e.key===' '||e.key==='k'){e.preventDefault();_hlsVideo.paused?_hlsVideo.play():_hlsVideo.pause();}
    if(e.key==='ArrowLeft'){e.preventDefault();_hlsVideo.currentTime=Math.max(0,_hlsVideo.currentTime-10);}
    if(e.key==='ArrowRight'){e.preventDefault();_hlsVideo.currentTime=Math.min(_hlsVideo.duration||0,_hlsVideo.currentTime+10);}
    if(e.key==='ArrowUp'){e.preventDefault();_hlsVideo.volume=Math.min(1,_hlsVideo.volume+0.1);}
    if(e.key==='ArrowDown'){e.preventDefault();_hlsVideo.volume=Math.max(0,_hlsVideo.volume-0.1);}
    if(e.key==='f'){e.preventDefault();toggleDPFullscreen();}
    if(e.key==='m'){e.preventDefault();_hlsVideo.muted=!_hlsVideo.muted;}
  }
});

loadUserSources();
renderNav();
// renderHot(); // Removed as per user request
loadHome();

// === 可爱浮动装饰 ===
(function(){
  var decoSymbols = ['🎬','⭐','🍿','🎞️','💫','🌙','✨','🎭','🎵','💖'];
  var container = document.createElement('div');
  container.style.cssText = 'position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden';
  container.id = 'bgDecorations';
  document.body.appendChild(container);
  for (var i = 0; i < 5; i++) {
    var el = document.createElement('span');
    el.textContent = decoSymbols[i % decoSymbols.length];
    var x = Math.random() * 100;
    var y = Math.random() * 100;
    var size = 10 + Math.random() * 14;
    var dur = 15 + Math.random() * 25;
    var delay = Math.random() * -20;
    el.style.cssText = 'position:absolute;left:'+x+'%;top:'+y+'%;font-size:'+size+'px;opacity:0.06;animation:floatDeco '+dur+'s ease-in-out '+delay+'s infinite;filter:blur(0.5px);';
    container.appendChild(el);
  }
})();

// 独立渲染函数：负责将数据渲染到页面
function renderTrendingContent(gen, data) {
  if (gen !== _navGeneration) return;
  const container = document.getElementById('trendingContent');
  if (!container) return;
  
  _currentTrendingData = data;
  
  // 更新总数显示，让用户一眼看到数据量
  const countEl = document.getElementById('trendingTotalCount');
  if (countEl) countEl.textContent = '(共 ' + data.length + ' 部热播)';
  
  if (!data || data.length === 0) {
    container.innerHTML = '<div class="trending-empty">暂无数据，请查看下方固定热播</div>';
    return;
  }
  
  const totalPages = Math.ceil(data.length / TRENDING_PER_PAGE);
  if (_trendingPage > totalPages) _trendingPage = 1;
  
  const startIdx = (_trendingPage - 1) * TRENDING_PER_PAGE;
  const pageData = data.slice(startIdx, startIdx + TRENDING_PER_PAGE);
  
  let html = '<div class="trending-rank-list">';
  pageData.forEach(function(item, i) {
    const platformTag = item.platform ? '<span style="font-size:10px;color:var(--accent);margin-left:4px;">[' + item.platform + ']</span>' : '';
    const yearTag = (item.type === '电视剧' || item.type === '电影') ? ' <span class="new-tag">热</span>' : '';
    
    html += '<div class="trending-rank-item" onclick="doSearch(\'' + item.name.replace(/'/g, "\\'") + '\')">';
    html += '<span class="tr-num">' + (startIdx + i + 1) + '</span>';
    html += '<span class="tr-name">' + esc(item.name) + yearTag + '</span>';
    html += '<span class="tr-meta">' + platformTag + '</span>';
    html += '</div>';
  });
  html += '</div>';
  
  // 渲染分页控件
  if (totalPages > 1) {
    html += '<div class="pager" style="margin-top:20px;">';
    html += '<span class="pager-btn' + (_trendingPage <= 1 ? ' disabled' : '') + '" onclick="changeTrendingPage(' + (_trendingPage - 1) + ')">上一页</span>';
    
    let startP = Math.max(1, _trendingPage - 2);
    let endP = Math.min(totalPages, _trendingPage + 2);
    
    if (startP > 1) {
      html += '<span class="pager-btn" onclick="changeTrendingPage(1)">1</span>';
      if (startP > 2) html += '<span class="pager-info">...</span>';
    }
    
    for (let p = startP; p <= endP; p++) {
      html += '<span class="pager-btn' + (p === _trendingPage ? ' active' : '') + '" onclick="changeTrendingPage(' + p + ')">' + p + '</span>';
    }
    
    if (endP < totalPages) {
      if (endP < totalPages - 1) html += '<span class="pager-info">...</span>';
      html += '<span class="pager-btn" onclick="changeTrendingPage(' + totalPages + ')">' + totalPages + '</span>';
    }
    
    html += '<span class="pager-btn' + (_trendingPage >= totalPages ? ' disabled' : '') + '" onclick="changeTrendingPage(' + (_trendingPage + 1) + ')">下一页</span>';
    html += '<span class="pager-info">共 ' + totalPages + ' 页</span>';
    html += '</div>';
  }
  
  container.innerHTML = html;
}

// 加载并渲染实时热播数据 (多源并发获取 + 热度排序 + 播放时暂停 + 过滤解说)
async function loadAndRenderTrendingLive(gen, forceRefresh = false) {
  const cacheKey = 'wyh_live_trending_full';
  let trendingData = null;
  
  // 1. 尝试从 localStorage 读取 (24小时有效)，如果是强制刷新则跳过
  if (!forceRefresh) {
    try {
      const stored = localStorage.getItem(cacheKey);
      if (stored) {
        const parsed = JSON.parse(stored);
        if (Date.now() - parsed.ts < TRENDING_CACHE_TTL && parsed.items && parsed.items.length > 0) {
          trendingData = parsed.items;
        }
      }
    } catch(e) {}
  }

  // 2. 如果没有缓存，先用内置数据兜底，确保瞬间显示，不转圈等待
  if (!trendingData || trendingData.length === 0) {
    trendingData = HARDCODED_TRENDING_NAMES.map((item, i) => ({
      name: item.name,
      platform: item.platform,
      type: '电视剧',
      heat: 1000 - i, // 赋予初始热度用于排序
      order: i + 1
    })).filter(item => !isJieshuo(item.name));
  }

  // 立即渲染当前拥有的数据
  renderTrendingContent(gen, trendingData);

  // 3. 后台静默获取更多真实榜单数据 (如果正在播放视频，则暂停加载以节省资源并避免干扰)
  if (_playerOpen) return; 

  try {
    const platforms = [
      { key: 'qq', name: '腾讯' },
      { key: 'iqiyi', name: '爱奇艺' },
      { key: 'youku', name: '优酷' },
      { key: 'mgtv', name: '芒果' },
      { key: 'douban_tv', name: '豆瓣电视剧' },
      { key: 'douban_movie', name: '豆瓣电影' },
      { key: 'weibo_film', name: '微博影视' },
      { key: 'baidu_film', name: '百度影视' }
    ];

    // 如果中途开始播放，中断请求
    if (_playerOpen) return;

    const fetchPromises = platforms.map(async (p) => {
      try {
        const res = await apiFetch('https://api.vvhan.com/api/hotlist/' + p.key);
        if (res && res.success && Array.isArray(res.data)) {
          return res.data.map((item, i) => ({
            name: (item.title || item.name || '').trim(),
            platform: p.name,
            type: (p.key.includes('douban') && p.key.includes('movie')) ? '电影' : '电视剧',
            heat: item.hot || (1000 - i), // 使用真实热度或排名作为热度
            order: i + 1
          })).filter(item => item.name && item.name.length > 1 && !isJieshuo(item.name) && !isContentBlocked(item.name, '', '', ''));
        }
      } catch(e) { return []; }
      return [];
    });

    const results = await Promise.all(fetchPromises);
    
    // 合并、去重、按热度排序
    const mergedMap = new Map();
    trendingData.forEach(item => {
      const norm = item.name.replace(/\s+/g, '').toLowerCase();
      mergedMap.set(norm, item);
    });

    results.forEach(list => {
      list.forEach(item => {
        const norm = item.name.replace(/\s+/g, '').toLowerCase();
        if (!mergedMap.has(norm)) {
          mergedMap.set(norm, item);
        } else {
          // 如果已存在，保留热度更高的
          const existing = mergedMap.get(norm);
          if (item.heat > existing.heat) {
            existing.heat = item.heat;
            existing.platform = item.platform; // 更新来源
          }
        }
      });
    });

    // 转换为数组并按热度降序排列
    let newData = Array.from(mergedMap.values()).sort((a, b) => (b.heat || 0) - (a.heat || 0));
    
    // 重新分配 order
    newData.forEach((item, i) => { item.order = i + 1; });

    // 核心逻辑：将获取到的标准剧名，追加到下方固定片源 CURATED_HOT 中，绝不淘汰原片名
    newData.forEach(item => {
      if (item.type === '电视剧' || item.type === '电影') {
        const catList = CURATED_HOT[item.type] || [];
        const normName = item.name.replace(/\s+/g, '').toLowerCase();
        if (!catList.some(it => it.name.replace(/\s+/g, '').toLowerCase() === normName)) {
          catList.push({
            name: item.name,
            type: item.type,
            class: '',
            area: '大陆',
            year: new Date().getFullYear().toString(),
            remarks: item.type === '电视剧' ? '热播中' : '正片',
            pic: '',
            actor: ''
          });
          CURATED_HOT[item.type] = catList;
        }
      }
    });

    // 保存到 localStorage (24小时有效)
    if (newData.length > 0) {
      localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), items: newData }));
    }

    // 4. 重新渲染更新后的数据 (如果未开始播放且导航未切换)
    if (!_playerOpen && gen === _navGeneration) {
      _globalTrendingData = newData; // 保存全局数据
      renderTrendingContent(gen, newData);
      
      // 5. 启动无限加载机制：只要不观看剧，就每隔3秒持续追加更多热播数据，彻底突破分页限制
      if (!_trendingAutoLoadInterval) {
        _trendingAutoLoadInterval = setInterval(function() {
          if (_playerOpen) return; // 观看时暂停加载，节省资源
          
          const platforms = [
            { key: 'qq', name: '腾讯' }, { key: 'iqiyi', name: '爱奇艺' },
            { key: 'youku', name: '优酷' }, { key: 'mgtv', name: '芒果' },
            { key: 'douban_tv', name: '豆瓣电视剧' }, { key: 'douban_movie', name: '豆瓣电影' }
          ];
          
          Promise.all(platforms.map(async (p) => {
            try {
              const res = await apiFetch('https://api.vvhan.com/api/hotlist/' + p.key);
              if (res && res.success && Array.isArray(res.data)) {
                return res.data.map((item, i) => ({
                  name: (item.title || item.name || '').trim(),
                  platform: p.name,
                  type: (p.key.includes('douban') && p.key.includes('movie')) ? '电影' : '电视剧',
                  heat: item.hot || (1000 - i),
                  order: _globalTrendingData.length + i + 1
                })).filter(item => item.name && item.name.length > 1 && !isJieshuo(item.name));
              }
            } catch(e) { return []; }
            return [];
          })).then(results => {
            if (_playerOpen) return;
            
            const listContainer = document.querySelector('.trending-rank-list');
            const countEl = document.getElementById('trendingTotalCount');
            
            if (!listContainer) return;
            
            let addedCount = 0;
            let newHtml = '';
            
            results.forEach(list => {
              list.forEach(item => {
                const norm = item.name.replace(/\s+/g, '').toLowerCase();
                // 检查是否已经存在
                let exists = false;
                for (let i = 0; i < _globalTrendingData.length; i++) {
                  if (_globalTrendingData[i].name.replace(/\s+/g, '').toLowerCase() === norm) {
                    exists = true;
                    break;
                  }
                }
                
                if (!exists) {
                  _globalTrendingData.push(item);
                  addedCount++;
                  const platformTag = item.platform ? '<span style="font-size:10px;color:var(--accent);margin-left:4px;">[' + item.platform + ']</span>' : '';
                  const yearTag = (item.type === '电视剧' || item.type === '电影') ? ' <span class="new-tag">热</span>' : '';
                  newHtml += '<div class="trending-rank-item" onclick="doSearch(\'' + item.name.replace(/'/g, "\\'") + '\')">';
                  newHtml += '<span class="tr-num">' + _globalTrendingData.length + '</span>';
                  newHtml += '<span class="tr-name">' + esc(item.name) + yearTag + '</span>';
                  newHtml += '<span class="tr-meta">' + platformTag + '</span>';
                  newHtml += '</div>';
                }
              });
            });
            
            // 如果有新数据，直接追加到 DOM 末尾，并更新总数，彻底绕过任何分页限制
            if (addedCount > 0) {
              listContainer.insertAdjacentHTML('beforeend', newHtml);
              if (countEl) countEl.textContent = '(共 ' + _globalTrendingData.length + ' 部热播，持续加载中...)';
            }
          });
        }, 3000); // 每3秒持续加载一次，越多越好
      }
    }

  } catch(e) {
    console.warn('后台获取热播数据失败:', e);
  }
}

async function fetchHomepageImages(cats) {
  const gen = _navGeneration;
  // Stagger: fetch first 2 categories immediately, then rest after a delay
  for (let ci = 0; ci < cats.length; ci++) {
    const cat = cats[ci];
    if (gen !== _navGeneration) return;
    if (_playerOpen) return;
    // After first 2 categories, add a small delay to avoid flooding the network
    if (ci === 2) await new Promise(r => setTimeout(r, 1500));
    try {
      const apiItems = await apiLoadCatFull(cat);
      if (gen !== _navGeneration) return; // 再次检查
      if (!apiItems.length) continue;
      const curated = CURATED_HOT[cat] || [];
      const enriched = enrichWithApi(cat, curated, apiItems);
      _catCache[cat] = { data: enriched, ts: Date.now() };
      CURATED_HOT[cat] = enriched;
      const imgCache = getImgCache();
      enriched.forEach(function(item) { if (item.pic) imgCache[item.name] = item.pic; });
      setImgCache(imgCache);
      if (curCat === 0 && gen === _navGeneration) {
        const hp = document.getElementById('homePage');
        if (hp && hp.style.display !== 'none') {
          // Update cards in-place instead of rebuilding entire page
          var allCards = hp.querySelectorAll('.card');
          allCards.forEach(function(card) {
            var titleEl = card.querySelector('.card-title');
            if (!titleEl) return;
            var name = titleEl.textContent;
            var matched = enriched.find(function(it) { return it.name === name; });
            if (!matched || !matched.pic) return;
            var poster = card.querySelector('.card-poster');
            if (!poster) return;
            var existingImg = poster.querySelector('img');
            if (existingImg && existingImg.src) return; // already has image
            var ph = poster.querySelector('.card-ph');
            if (!ph) return;
            var img = document.createElement('img');
            img.src = proxyImg(matched.pic);
            img.alt = (matched.name || name) + ' 海报';
            img.loading = 'eager';
            img.fetchPriority = 'high';
            img.referrerPolicy = 'no-referrer';
            img.style.opacity = '0';
            img.style.transition = 'opacity 0.4s ease';
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'cover';
            img.style.display = 'block';
            img.onload = function() { img.style.opacity = '1'; ph.style.display = 'none'; };
            img.onerror = function() { img.style.display = 'none'; ph.style.display = 'flex'; };
            poster.insertBefore(img, ph);
            // Update onclick data
            var d = JSON.stringify(matched).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;');
            card.setAttribute('onclick', 'openPlayer('+d+')');
            // Update remarks/episode badge
            var epBadge = poster.querySelector('.card-ep');
            if (matched.remarks) {
              if (epBadge) { epBadge.textContent = matched.remarks; }
              else { var eb = document.createElement('div'); eb.className = 'card-ep'; eb.textContent = matched.remarks; poster.appendChild(eb); }
            }
          });
        }
      }
    } catch(e) {}
  }
}

// 后台为缺图的条目搜索封面图片
var _imgFetchQueue = [];
var _imgFetchRunning = false;
var _playerOpen = false; // 播放器打开时暂停图片加载，释放带宽给视频

function queueMissingImages(items) {
  var imgCache = getImgCache();
  var missing = items.filter(function(it) {
    return it.name && !it.pic && !imgCache[it.name];
  });
  if (!missing.length) return;
  // 去重
  var queued = new Set(_imgFetchQueue.map(function(m) { return m.name; }));
  missing.forEach(function(it) {
    if (!queued.has(it.name)) {
      _imgFetchQueue.push(it);
      queued.add(it.name);
    }
  });
  if (!_imgFetchRunning) runImageFetcher();
}

async function runImageFetcher() {
  _imgFetchRunning = true;
  var batchSize = 4; // 每批并发4个
  while (_imgFetchQueue.length > 0) {
    if (_playerOpen) { _imgFetchRunning = false; return; } // 播放器打开时暂停，释放带宽
    var batch = _imgFetchQueue.splice(0, batchSize);
    await Promise.all(batch.map(async function(item) {
      // 尝试从前3个API源搜索图片
      for (var si = 0; si < Math.min(3, API_SOURCES.length); si++) {
        try {
          var src = API_SOURCES[si];
          var data = await apiFetch(src.api + '?ac=detail&wd=' + encodeURIComponent(item.name));
          if (data && data.list) {
            var match = data.list.find(function(v) {
              return v.vod_pic && v.vod_name && (v.vod_name === item.name || v.vod_name.includes(item.name) || item.name.includes(v.vod_name));
            });
            if (match && match.vod_pic) {
              item.pic = match.vod_pic;
              cacheImg(item.name, match.vod_pic);
              // 将API匹配结果转换为完整的item对象，确保海报和播放数据一致
              var matchedItem = mapVodItem(match, src.name);
              // 保留原始item中有效的字段作为回退
              if (!matchedItem.playUrl && item.playUrl) matchedItem.playUrl = item.playUrl;
              if (!matchedItem.playFrom && item.playFrom) matchedItem.playFrom = item.playFrom;
              // 更新页面上对应的卡片（包括海报和onclick数据）
              updateCardImage(item.name, match.vod_pic, matchedItem);
              break;
            }
          }
        } catch(e) {}
      }
    }));
  }
  _imgFetchRunning = false;
}

function updateCardImage(name, picUrl, matchedItem) {
  var allCards = document.querySelectorAll('.card');
  allCards.forEach(function(card) {
    var titleEl = card.querySelector('.card-title');
    if (!titleEl || titleEl.textContent !== name) return;
    var poster = card.querySelector('.card-poster');
    if (!poster) return;
    var existingImg = poster.querySelector('img');
    if (existingImg && existingImg.src && !existingImg.src.includes('data:')) return;
    var ph = poster.querySelector('.card-ph');
    if (!ph) return;
    var img = document.createElement('img');
    img.src = proxyImg(picUrl);
    img.alt = name + ' 海报';
    img.loading = 'eager';
    img.referrerPolicy = 'no-referrer';
    img.style.opacity = '0';
    img.style.transition = 'opacity 0.4s ease';
    img.style.width = '100%';
    img.style.height = '100%';
    img.style.objectFit = 'cover';
    img.style.display = 'block';
    img.onload = function() { img.style.opacity = '1'; ph.style.display = 'none'; };
    img.onerror = function() { img.style.display = 'none'; ph.style.display = 'flex'; };
    poster.insertBefore(img, ph);
    // 同步更新onclick数据，确保点击播放的内容与海报一致
    if (matchedItem) {
      var d = JSON.stringify(matchedItem).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;');
      card.setAttribute('onclick', 'openPlayer('+d+')');
      // 更新集数标签
      var epBadge = poster.querySelector('.card-ep');
      if (matchedItem.remarks) {
        if (epBadge) { epBadge.textContent = matchedItem.remarks; }
        else { var eb = document.createElement('div'); eb.className = 'card-ep'; eb.textContent = matchedItem.remarks; poster.appendChild(eb); }
      }
    }
  });
}

function enrichWithCache(catName, curated) {
  const cache = _catCache[catName];
  if (!cache || !cache.data.length) return curated;
  return enrichWithApi(catName, curated, cache.data);
}

function enrichWithApi(catName, curated, apiItems) {
  const apiMap = {};
  const apiList = [];
  for (const item of apiItems) {
    if (item.name) {
      apiMap[item.name] = item;
      apiList.push(item);
    }
  }
  const usedNames = new Set();
  const result = curated.map(c => {
    let api = apiMap[c.name];
    if (!api) {
      api = apiList.find(a => !usedNames.has(a.name) && (a.name.includes(c.name) || c.name.includes(a.name)));
    }
    if (api) {
      usedNames.add(api.name);
      return { ...c, pic: api.pic || c.pic, actor: api.actor || c.actor,
               playFrom: api.playFrom || c.playFrom || '', playUrl: api.playUrl || c.playUrl || '',
               id: api.id || c.id, sourceIdx: api.sourceIdx !== undefined ? api.sourceIdx : c.sourceIdx,
               source: api.source || c.source,
               remarks: api.remarks || c.remarks };
    }
    return c;
  });
  if (result.length < 300) {
    const curatedNames = new Set(curated.map(c => c.name));
    for (const api of apiList) {
      if (result.length >= 300) break;
      if (!curatedNames.has(api.name) && !usedNames.has(api.name)) {
        result.push(api);
        usedNames.add(api.name);
      }
    }
  }
  // Cache images after enrichment
  const imgCache = getImgCache();
  result.forEach(function(item) { if (item.pic) imgCache[item.name] = item.pic; });
  setImgCache(imgCache);
  return result;
}

    delete _searchCache['search:' + retryKw + ':-1'];
    delete _searchCache['search:' + keyword + ':-1'];
    await new Promise(r => setTimeout(r, 500));
    results = await apiSearch(retryKw, -1, function(partial, sourceName, completed, total) {
      const filteredPartial = partial.filter(r => !isJieshuo(r.name));
      if (srList) srList.innerHTML = filteredPartial.map(r => srItemHTML(r)).join('');
      if (srCount) srCount.textContent = '已找到 ' + filteredPartial.length + ' 条结果';

      if (pt && completed && total) pt.textContent = '重试搜索... (' + completed + '/' + total + ') 已找到 ' + filteredPartial.length + ' 条';
    });
  }

  if (srProgress) srProgress.style.display = 'none';
  
  // 最终过滤：排除所有“电影解说”类无意义结果
  results = results.filter(r => !isJieshuo(r.name));
  
  if (results.length === 0) {
    if (srList) srList.innerHTML = '<div class="empty">未找到相关结果，请尝试其他关键词</div>';
    if (srCount) srCount.textContent = '共 0 条结果';
  } else {
    if (srCount) srCount.textContent = '共 ' + results.length + ' 条结果';
    if (srList) srList.innerHTML = results.map(r => srItemHTML(r)).join('');
  }
}

// === 智能选源：自动探测最优播放资源和线路 ===
// 探测m3u8 URL是否可达，返回响应时间(ms)，失败返回Infinity
async function probeM3u8(url, timeout) {
  timeout = timeout || 2000;
  var start = performance.now();
  try {
    // 尝试直接fetch m3u8（可能跨域失败，但能测试连通性）
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, timeout);
    var resp = await fetch(url, {
      method: 'HEAD',
      mode: 'no-cors',
      signal: controller.signal,
      cache: 'no-store'
    });
    clearTimeout(timer);
    return performance.now() - start;
  } catch(e) {
    // no-cors模式下即使成功也可能是opaque response，我们用时间来判断
    var elapsed = performance.now() - start;
    // 如果在超时前返回，说明服务器有响应（即使跨域被阻止）
    if (elapsed < timeout - 100) return elapsed;
    return Infinity;
  }
}

// 从所有资源路线中选出最快的一条
async function autoSelectBestRoute(playData, epIndex) {
  if (!playData || playData.length === 0) return 0;
  if (playData.length === 1) return 0;
  epIndex = epIndex || 0;

  var candidates = [];
  for (var ri = 0; ri < playData.length; ri++) {
    if (playData[ri].episodes && playData[ri].episodes.length > epIndex) {
      var url = playData[ri].episodes[epIndex].url;
      if (url && /\.m3u8/i.test(url)) {
        candidates.push({ route: ri, url: url });
      }
    }
  }
  if (candidates.length === 0) return 0;
  if (candidates.length === 1) return candidates[0].route;

  // 优先使用缓存的源评分数据
  var scoreCache = _routeScoreCache || {};
  var hasCachedScores = false;
  candidates.forEach(function(c) {
    var host = extractHost(c.url);
    if (scoreCache[host] && Date.now() - scoreCache[host].ts < 30 * 60 * 1000) {
      c.cachedTime = scoreCache[host].time;
      hasCachedScores = true;
    }
  });
  if (hasCachedScores) {
    var withCache = candidates.filter(function(c) { return c.cachedTime !== undefined; });
    if (withCache.length > 0) {
      withCache.sort(function(a, b) { return a.cachedTime - b.cachedTime; });
      if (withCache[0].cachedTime < 3000) return withCache[0].route;
    }
  }

  // 并发探测所有候选m3u8，选最快的
  var results = await Promise.all(candidates.map(async function(c) {
    var time = await probeM3u8(c.url, 1500);
    // 记录评分
    var host = extractHost(c.url);
    if (!_routeScoreCache) _routeScoreCache = {};
    _routeScoreCache[host] = { time: time, ts: Date.now() };
    return { route: c.route, time: time, url: c.url };
  }));

  // 按响应时间排序
  results.sort(function(a, b) { return a.time - b.time; });

  // 选最快的那条
  if (results[0].time < Infinity) {
    return results[0].route;
  }
  return 0; // 都超时就用第一条
}

// 辅助函数：提取URL的host
function extractHost(url) {
  try { return new URL(url).host; } catch(e) { return url.slice(0, 50); }
}

// === PLAYER ===
function parsePlayData(playFrom, playUrl) {
  const sources = (playFrom||'').split('$$$');
  const groups = (playUrl||'').split('$$$');
  const out = [];
  for (let i = 0; i < sources.length; i++) {
    if (!groups[i]) continue;
    const eps = groups[i].split('#').map(e => {
      const p = e.split('$');
      return p.length >= 2 ? {name:p[0], url:p[1]} : null;
    }).filter(Boolean);
    if (eps.length) out.push({source:sources[i], episodes:eps});
  }
  const m3u8Only = out.filter(s => /m3u8/i.test(s.source));
  return m3u8Only.length > 0 ? m3u8Only : out;
}

let _playData = [], _curRoute = 0;

// === 名称匹配评分函数：精确匹配 > 双向包含 > 单向包含 ===
function nameMatchScore(vodName, searchName) {
  if (!vodName || !searchName) return 0;
  if (vodName === searchName) return 100; // 完全匹配
  if (vodName.includes(searchName) && searchName.includes(vodName)) return 90; // 双向包含（几乎一样）
  if (vodName === searchName + ' ' || ' ' + vodName === searchName) return 85; // 多余空格
  if (vodName.includes(searchName) && vodName.length <= searchName.length + 4) return 70; // 包含且长度接近
  if (searchName.includes(vodName) && searchName.length <= vodName.length + 4) return 65;
  if (vodName.includes(searchName)) return 30; // 单向包含但长度差距大
  if (searchName.includes(vodName)) return 25;
  return 0;
}

// === 从API结果列表中选择最佳匹配 ===
function bestMatch(list, name) {
  if (!list || !list.length) return null;
  let best = null, bestScore = 0;
  for (var i = 0; i < list.length; i++) {
    var v = list[i];
    if (!v.vod_play_url) continue;
    var score = nameMatchScore(v.vod_name, name);
    if (score > bestScore) { bestScore = score; best = v; }
  }
  return best; // 如果没有任何名称匹配（score=0），返回null而不是随机结果
}

// Mobile: after first tap absorbed by overlay, auto-hide overlay so second tap goes to video
(function(){
  document.addEventListener('touchend', function(e){
    var ov = document.getElementById('adBlockOverlay');
    if(!ov || !ov.contains(e.target)) return;
    // First tap: overlay absorbs it (blocks the ad). Then disable overlay.
    ov.style.pointerEvents = 'none';
    ov.style.zIndex = 0;
    // Re-enable overlay after 8s to catch subsequent ad injections
    setTimeout(function(){
      if(ov && ov.parentNode){
        ov.style.pointerEvents = 'auto';
        ov.style.zIndex = 2147483647;
      }
    }, 8000);
  }, true);

// Enhanced ad-click blocker for player area (desktop + mobile)
(function(){
  // Block ad clicks in player area
  document.addEventListener('click', function(e) {
    var pa = document.querySelector('.player-area');
    if (!pa || !pa.contains(e.target)) return;
    if (e.target.closest('.p-back,.p-top,.p-next-btn,.p-open-btn,.p-fs-btn,.p-side,.p-pill,.p-ep,#adBlockOverlay,#uiDetectOverlay')) return;
    if (e.target.tagName === 'A' || (e.target.closest && e.target.closest('a'))) {
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); return false;
    }
  }, true);

  // Mobile: block touchstart on ad overlays within player
  document.addEventListener('touchstart', function(e) {
    var pa = document.querySelector('.player-area');
    if (!pa || !pa.contains(e.target)) return;
    var t = e.target;
    if (t.id === 'adBlockOverlay' || t.id === 'uiDetectOverlay') return; // let our overlays handle it
    if (t.closest('.p-back,.p-top,.p-next-btn,.p-open-btn,.p-fs-btn,.p-side,.p-pill,.p-ep')) return;
    if (t.tagName === 'IFRAME' || t.tagName === 'VIDEO') return;
    // Block touch on suspicious overlay elements inside player
    if (t.tagName === 'A' || t.tagName === 'DIV' || t.tagName === 'SPAN' || t.tagName === 'IMG') {
      try {
        var st = getComputedStyle(t);
        if ((st.position === 'absolute' || st.position === 'fixed') && parseInt(st.zIndex) >= 1) {
          if (!t.closest('.p-top,.p-side,.p-next-btn,.p-open-btn,.p-fs-btn,.p-back') && t.id !== 'adBlockOverlay') {
            e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
            t.remove();
            return false;
          }
        }
      } catch(ex){}
    }
  }, {capture:true, passive:false});

  // Periodic cleanup inside player area (reduced frequency)
  setInterval(function(){
    var pa = document.querySelector('.player-area');
    if (!pa) return;
    pa.querySelectorAll('a,[style*="z-index"]').forEach(function(el){
      if (el.tagName === 'IFRAME' || el.tagName === 'VIDEO' || el.id === 'adBlockOverlay' || el.id === 'uiDetectOverlay') return;
      if (el.closest('.p-top,.p-side,.p-next-btn,.p-open-btn,.p-fs-btn,.p-back')) return;
      try {
        var st = getComputedStyle(el);
        if ((st.position === 'absolute' || st.position === 'fixed') && parseInt(st.zIndex) > 1) {
          el.remove();
        }
      } catch(ex){}
    });
  }, 5000);
})();

// 获取当前播放进度（尽一切努力拿到时间），用于切换线路/资源时保留
function getCurrentPlayTime() {
  var t = 0;
  // 1. 直连模式：从video元素读取
  if (_directMode && _hlsVideo) {
    try { if (_hlsVideo.currentTime > 0) t = Math.floor(_hlsVideo.currentTime); } catch(e) {}
  }
  // 2. iframe模式：尝试同源访问
  if (t < 1) {
    try {
      var iframe = document.querySelector('.player-area iframe');
      if (iframe) {
        var iDoc = iframe.contentDocument || iframe.contentWindow.document;
        if (iDoc) {
          var videos = iDoc.querySelectorAll('video');
          videos.forEach(function(v) { if (v.currentTime > 0) t = Math.floor(v.currentTime); });
        }
      }
    } catch(e) {}
  }
  // 3. 从localStorage读取上次保存的进度（每5秒自动保存一次）
  if (t < 5) {
    var titleEl = document.querySelector('.p-title');
    if (titleEl) {
      var memEntry = getPlaybackMemFor(titleEl.textContent);
      if (memEntry && memEntry.time > t) t = memEntry.time;
    }
  }
  return t;
}

async function fetchDetailAndOpen(item) {
  _playerOpen = true; // 暂停图片加载
  const name = item.name||'';
  document.getElementById('modalBox').innerHTML =
    '<div class="player-area"><div class="player-loading"><div class="spin"></div>正在加载 "'+esc(name)+'" ...</div></div>'

  // 收集所有源的结果，选择最佳匹配（不再用竞速模式）
  const racingSources = [src, ...API_SOURCES.slice(0, 5).filter(s => s !== src)];
  const candidates = []; // {item, score}

  try {
    const results = await Promise.allSettled(racingSources.map(async (s, idx) => {
      const url = idx === 0
        ? s.api + '?ac=detail&ids=' + item.id
        : s.api + '?ac=detail&wd=' + encodeURIComponent(name);
      const data = await apiFetch(url);
      if (data && data.list && data.list.length > 0) {
        if (idx === 0) {
          // 使用ID查询的第一个源，取第一条结果但要验证名称
          var first = data.list[0];
          if (first && first.vod_play_url) {
            var score = nameMatchScore(first.vod_name, name);
            if (score >= 25) return { item: mapVodItem(first, s.name), score: score + 5 }; // ID查询加分
          }
        }
        // 名称搜索：用评分选最佳
        var match = bestMatch(data.list, name);

        }
      }
      return null;
    }));

    // 从所有结果中选最高分
    results.forEach(r => { if (r.status === 'fulfilled' && r.value) candidates.push(r.value); });
    candidates.sort((a, b) => b.score - a.score);

    if (candidates.length > 0 && candidates[0].item.playUrl) {
      opened = true;
      closePlayer();
      openPlayer(candidates[0].item);
    }
  } catch(e) {}

  if (!opened) { closePlayer(); searchAndOpen(name); }
}

async function searchAndOpen(name) {
  _playerOpen = true; // 暂停图片加载
  document.getElementById('modalBox').innerHTML =
    '<div class="player-area"><div class="player-loading"><div class="spin"></div>正在搜索 "'+esc(name)+'" ...</div></div>'
    + '<div class="p-top"><button class="p-back" onclick="closePlayer()">&#8592;</button><span class="p-title">'+esc(name)+'</span></div>';
  document.getElementById('modalMask').classList.add('show');
  document.body.style.overflow = 'hidden';

  const cached = cacheGet('search:' + name + ':-1');
  if (cached && cached.length) {
    // 从缓存中用评分选最佳匹配
    let bestCached = null, bestCachedScore = 0;
    for (var ci = 0; ci < cached.length; ci++) {
      if (!cached[ci].playUrl) continue;
      var cs = nameMatchScore(cached[ci].name, name);
      if (cs > bestCachedScore) { bestCachedScore = cs; bestCached = cached[ci]; }
    }
    if (bestCached && bestCachedScore >= 25) { closePlayer(); openPlayer(bestCached); return; }
  }

  let opened = false;

  // 第一轮：并行查询前8个API源 + 所有短剧源，收集所有结果后选最佳匹配
  try {
    const candidates = [];
    const firstRoundSources = [...API_SOURCES.slice(0, 8), ...SHORT_DRAMA_SOURCES];
    // 去重同URL的源
    const seenUrls = new Set();
    const uniqueSources = firstRoundSources.filter(s => { if (seenUrls.has(s.api)) return false; seenUrls.add(s.api); return true; });
    const results = await Promise.allSettled(uniqueSources.map(async (src) => {
      const url = src.api + '?ac=detail&wd=' + encodeURIComponent(name);
      const data = await apiFetch(url);
      if (data && data.list && data.list.length > 0) {
        const match = bestMatch(data.list, name);
        if (match && match.vod_play_url) {
          return { item: mapVodItem(match, src.name), score: nameMatchScore(match.vod_name, name), allItems: data.list.map(v => mapVodItem(v, src.name)) };
        }
      }
      return null;
    }));

    results.forEach(r => { if (r.status === 'fulfilled' && r.value) candidates.push(r.value); });
    candidates.sort((a, b) => b.score - a.score);

    if (candidates.length > 0 && candidates[0].score >= 25) {
      opened = true;
      if (candidates[0].allItems) cacheSet('search:' + name + ':-1', candidates[0].allItems);
      closePlayer();
      openPlayer(candidates[0].item);
    }
  } catch(e) {}

  // 第二轮：如果前8个都没找到，用扩展关键词在剩余源搜索
  if (!opened) {
    try {
      const candidates2 = [];
      const expandedNames = expandKeywords(name);
      const secondRoundSources = API_SOURCES.slice(8);
      const searchTasks = [];
      for (var si3 = 0; si3 < secondRoundSources.length; si3++) {
        for (var ki = 0; ki < Math.min(expandedNames.length, 4); ki++) {
          searchTasks.push({ src: secondRoundSources[si3], kw: expandedNames[ki] });
        }
      }
      const results2 = await Promise.allSettled(searchTasks.map(async (task) => {
        const url = task.src.api + '?ac=detail&wd=' + encodeURIComponent(task.kw);
        const data = await apiFetch(url);
        if (data && data.list && data.list.length > 0) {
          const match = bestMatch(data.list, name);
          if (match && match.vod_play_url) {
            return { item: mapVodItem(match, task.src.name), score: nameMatchScore(match.vod_name, name) };
          }
          // If no exact match, also try picking the best from expanded keyword results
          for (var li = 0; li < data.list.length; li++) {
            var v = data.list[li];
            if (v.vod_play_url) {
              var sc = nameMatchScore(v.vod_name, name);
              if (sc >= 20) return { item: mapVodItem(v, task.src.name), score: sc };
            }
          }
        }
        return null;
      }));

      results2.forEach(r => { if (r.status === 'fulfilled' && r.value) candidates2.push(r.value); });
      candidates2.sort((a, b) => b.score - a.score);

      if (candidates2.length > 0 && candidates2[0].score >= 25) {
        opened = true;
        closePlayer();
        openPlayer(candidates2[0].item);
      }
    } catch(e) {}
  }

  if (!opened) {
    document.getElementById('modalBox').innerHTML =
      '<div class="player-area"><div class="player-loading" style="gap:16px">'
      + '<div style="font-size:48px;opacity:.5">&#128269;</div>'
      + '未找到 "'+esc(name)+'" 的播放源'
      + '<button onclick="retrySearchFromPlayer(\''+name.replace(/'/g,"\\'").replace(/\\/g,"\\\\")+'\')" style="margin-top:8px;padding:10px 28px;border-radius:20px;background:var(--accent-g);color:#fff;font-size:15px;font-weight:600;cursor:pointer;border:none;box-shadow:0 2px 12px rgba(255,140,107,.3)">重新搜索</button>'
      + '<span style="font-size:12px;color:rgba(255,255,255,.4);margin-top:4px">将返回搜索结果列表，手动选择要播放的内容</span>'
      + '</div></div>'
      + '<div class="p-top"><button class="p-back" onclick="closePlayer()">&#8592;</button><span class="p-title">'+esc(name)+'</span></div>';
  }
}

// === AUTO-PLAY NEXT ===
let _curEpIndex = 0;
let _autoNextLock = false;

const _origPlayEp = playEp;
playEp = function(r, i, btn) {
  _curEpIndex = i;
  _curRoute = r;
  _autoNextLock = false;
  cancelAutoNextCountdown();
  // Cancel any iframe seek timer
  if (window._iframeSeekTimer) { clearInterval(window._iframeSeekTimer); window._iframeSeekTimer = null; }
  // 如果是切换线路/资源触发的（_pendingSavedTime > 0），保留进度不清零
  var isRouteSwitch = window._pendingSavedTime && window._pendingSavedTime > 0;
  if (!isRouteSwitch) {
    // 手动切集：清除进度，从头播放
    window._pendingSavedTime = 0;
  }
  _origPlayEp(r, i, btn);
  // Save playback memory
  const currentName = document.querySelector('.p-title');
  if (currentName) {
    const epName = _playData[r] && _playData[r].episodes[i] ? _playData[r].episodes[i].name : '';
    // 切换线路/资源时保留原有进度时间，不覆盖为0
    if (isRouteSwitch) {
      setPlaybackMem(currentName.textContent, r, i, epName, window._pendingSavedTime);
    } else {
      setPlaybackMem(currentName.textContent, r, i, epName, 0);
    }
  }
  startEpMonitor();
  startProgressSaver();
};

let _epMonitorTimer = null;
let _epIframeLoadTime = 0;

function startEpMonitor() {
  if (_epMonitorTimer) clearInterval(_epMonitorTimer);
  _epIframeLoadTime = Date.now();
  _autoNextLock = false;

  _epMonitorTimer = setInterval(function() {
    if (_autoNextLock) return;
    try {
      const iframe = document.querySelector('.player-area iframe');
      if (!iframe) return;

      try {
        const iDoc = iframe.contentDocument || iframe.contentWindow.document;
        if (iDoc) {
          const videos = iDoc.querySelectorAll('video');
          videos.forEach(function(v) {
            if (v.ended && v.duration > 120 && v.currentTime > 60) {
              triggerAutoNext();
            }
            if (v.duration > 120 && v.currentTime > 60 && (v.duration - v.currentTime) < 2 && !v.paused) {
              triggerAutoNext();
            }
          });
        }
      } catch(e) {}

      try {
        iframe.contentWindow.postMessage({type:'getVideoStatus'}, '*');
        iframe.contentWindow.postMessage('getVideoStatus', '*');
      } catch(e) {}

    } catch(e) {}
  }, 3000);
}

window.addEventListener('message', function(e) {
  if (_autoNextLock) return;
  try {
    let data = e.data;
    if (typeof data === 'string') {
      if (data === 'ended' || data === 'videoEnd' || data === 'end' || data === 'complete') {
        triggerAutoNext();
        return;
      }
      try { data = JSON.parse(data); } catch(ex) { return; }
    }
    if (!data || typeof data !== 'object') return;

    const evtType = data.type || data.event || data.msg || data.cmd || data.action || data.name || '';
    if (/^(ended|end|videoEnd|complete|finish|over|playEnd|playComplete)$/i.test(evtType)) {
      triggerAutoNext();
      return;
    }

    const ct = data.currentTime || data.time || data.current || 0;
    const dur = data.duration || data.totalTime || data.total || 0;
    // Only trigger auto-next from messages if duration is substantial and time is very close to end
    if (dur > 120 && ct > 60 && (dur - ct) < 2 && (dur - ct) >= 0) {
      triggerAutoNext();
      return;
    }

    // Require very high percentage AND substantial reported duration to avoid false triggers from ad iframes
    const pct = data.percent || data.percentage || data.progress || -1;
    if (pct >= 99.5 && dur > 120) {
      triggerAutoNext();
      return;
    }
  } catch(ex) {}
});

function triggerAutoNext() {
  if (_autoNextLock) return;
  // Guard: must have played at least 60 seconds since episode load to prevent false triggers
  var elapsed = Date.now() - _epIframeLoadTime;
  if (elapsed < 60000) return;
  _autoNextLock = true;
  showAutoNextCountdown();
}

let _countdownTimer = null;
function showAutoNextCountdown() {
  cancelAutoNextCountdown();
  _autoNextLock = true;
  const eps = _playData[_curRoute] ? _playData[_curRoute].episodes : null;
  const nextIdx = _curEpIndex + 1;
  if (!eps || nextIdx >= eps.length) {
    showAutoNextTip('已是最后一集');
    _autoNextLock = false;
    return;
  }

  let seconds = 5;
  const overlay = document.createElement('div');
  overlay.id = 'autoNextOverlay';
  overlay.style.cssText = 'position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:300;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);color:#fff;padding:14px 28px;border-radius:12px;font-size:14px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 32px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);';

  function updateText() {
    overlay.innerHTML = '<span>即将播放下一集: <b>' + esc(eps[nextIdx].name) + '</b> (' + seconds + 's)</span>'
      + '<button onclick="cancelAutoNextCountdown()" style="background:rgba(255,255,255,.15);color:#fff;padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;border:none;white-space:nowrap">取消</button>';
  }
  updateText();
  document.body.appendChild(overlay);

  _countdownTimer = setInterval(function() {
    seconds--;
    if (seconds <= 0) {
      cancelAutoNextCountdown();
      autoPlayNext();
    } else {
      updateText();
    }
  }, 1000);
}

function cancelAutoNextCountdown() {
  if (_countdownTimer) { clearInterval(_countdownTimer); _countdownTimer = null; }
  var el = document.getElementById('autoNextOverlay');
  if (el) el.remove();
  _autoNextLock = false;
}

function autoPlayNext() {
  if (!_playData || !_playData[_curRoute]) return;
  const eps = _playData[_curRoute].episodes;
  const nextIdx = _curEpIndex + 1;
  if (nextIdx >= eps.length) {
    showAutoNextTip('已是最后一集');
    _autoNextLock = false;
    return;
  }

  _autoNextLock = false;

  // Use the full playEp flow (which handles direct mode, progress, memory, etc.)
  var epBtn = document.querySelectorAll('.p-ep')[nextIdx] || null;
  playEp(_curRoute, nextIdx, epBtn);

  showAutoNextTip('自动播放: ' + eps[nextIdx].name);
}

function manualNextEp() {
  _autoNextLock = false;
  cancelAutoNextCountdown();
  autoPlayNext();
}

function showAutoNextTip(text) {
  const existing = document.getElementById('autoNextTip');
  if (existing) existing.remove();
  const tip = document.createElement('div');
  tip.id = 'autoNextTip';
  tip.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:300;background:rgba(255,140,107,0.92);color:#fff;padding:10px 24px;border-radius:20px;font-size:15px;font-weight:600;backdrop-filter:blur(8px);transition:opacity 0.5s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 15px rgba(0,0,0,.3);';
  tip.textContent = text;
  document.body.appendChild(tip);
  setTimeout(function() {
    tip.style.opacity = '0';
    setTimeout(function() { tip.remove(); }, 600);
  }, 3500);
}

function cleanupPlayer() {
  if (_epMonitorTimer) { clearInterval(_epMonitorTimer); _epMonitorTimer = null; }
  if (_progressSaveTimer) { clearInterval(_progressSaveTimer); _progressSaveTimer = null; }
  cancelAutoNextCountdown();
  _curEpIndex = 0;
  _autoNextLock = false;
}

// === PERIODIC PLAYBACK TIME SAVER ===
let _progressSaveTimer = null;
function startProgressSaver() {
  if (_progressSaveTimer) clearInterval(_progressSaveTimer);
  _progressSaveTimer = setInterval(function() {
    var titleEl = document.querySelector('.p-title');
    if (!titleEl) return;
    var name = titleEl.textContent;
    if (!name) return;
    // 使用统一的时间获取函数（但不读localStorage回退，避免循环写入旧值）
    var currentTime = 0;
    if (_directMode && _hlsVideo) {
      try { if (_hlsVideo.currentTime > 0) currentTime = Math.floor(_hlsVideo.currentTime); } catch(e) {}
    }
    if (currentTime < 1) {
      try {
        var iframe = document.querySelector('.player-area iframe');
        if (iframe) {
          var iDoc = iframe.contentDocument || iframe.contentWindow.document;
          if (iDoc) {
            var videos = iDoc.querySelectorAll('video');
            videos.forEach(function(v) {
              if (v.currentTime > 0 && v.duration > 0) currentTime = Math.floor(v.currentTime);
            });
          }
        }
      } catch(e) {}
    }

    if (currentTime > 5) {
      var epName = _playData[_curRoute] && _playData[_curRoute].episodes[_curEpIndex]
        ? _playData[_curRoute].episodes[_curEpIndex].name : '';
      setPlaybackMem(name, _curRoute, _curEpIndex, epName, currentTime);
    }
  }, 3000); // Save every 3 seconds for reliable progress recovery
}

// Seek to saved time after video loads (for direct mode)
function seekToSavedTime(video, savedTime) {
  if (!video || !savedTime || savedTime < 5) return;
  function doSeek() {
    if (video.duration && video.duration > 0 && savedTime < video.duration - 5) {
      video.currentTime = savedTime;
      video.removeEventListener('loadedmetadata', doSeek);
      video.removeEventListener('canplay', doSeek);
      showAutoNextTip('已跳转到上次观看位置 ' + fmtTime(savedTime));
    }
  }
  if (video.readyState >= 1 && video.duration > 0) {
    doSeek();
  } else {
    video.addEventListener('loadedmetadata', doSeek);
    video.addEventListener('canplay', doSeek);
  }
}

// Seek iframe video to saved time (try periodically since cross-origin may block)
function seekIframeToSavedTime(savedTime) {
  if (!savedTime || savedTime < 5) return;
  // Cancel any previous seek timer
  if (window._iframeSeekTimer) { clearInterval(window._iframeSeekTimer); window._iframeSeekTimer = null; }
  var attempts = 0;
  var maxAttempts = 30; // Try for up to 30 seconds (iframe may load slowly)
  var seeked = false;
  function trySeek() {
    if (seeked) return;
    attempts++;
    if (attempts > maxAttempts) { clearInterval(seekTimer); window._iframeSeekTimer = null; return; }
    try {
      var iframe = document.querySelector('.player-area iframe');
      if (!iframe) return;
      // Try direct access (same-origin)
      try {
        var iDoc = iframe.contentDocument || iframe.contentWindow.document;
        if (iDoc) {
          var videos = iDoc.querySelectorAll('video');
          videos.forEach(function(v) {
            if (v.duration && v.duration > 0 && savedTime < v.duration - 5 && Math.abs(v.currentTime - savedTime) > 3) {
              v.currentTime = savedTime;
              seeked = true;
              clearInterval(seekTimer);
              window._iframeSeekTimer = null;
              showAutoNextTip('已跳转到上次观看位置 ' + fmtTime(savedTime));
            }
          });
        }
      } catch(e) { /* cross-origin */ }
      // Try postMessage (cross-origin) - multiple common formats
      if (!seeked) {
        try {
          iframe.contentWindow.postMessage({type:'seek', time: savedTime}, '*');
          iframe.contentWindow.postMessage({event:'seek', currentTime: savedTime}, '*');
          iframe.contentWindow.postMessage(JSON.stringify({method:'seek', time: savedTime}), '*');
          // DPlayer format
          iframe.contentWindow.postMessage(JSON.stringify({event:'seek', time: savedTime}), '*');
        } catch(e) {}
      }
    } catch(e) {}
  }
  var seekTimer = setInterval(trySeek, 1000);
  // Also try immediately when iframe loads
  var iframe = document.querySelector('.player-area iframe');
  if (iframe) {
    iframe.addEventListener('load', function onLoad() {
      iframe.removeEventListener('load', onLoad);
      // Wait a brief moment for the player inside iframe to initialize
      setTimeout(trySeek, 500);
      setTimeout(trySeek, 1500);
      setTimeout(trySeek, 3000);
    });
  }
  // Store timer so we can cancel it
  window._iframeSeekTimer = seekTimer;
}

  h.unshift({name, time: new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})});

// 从观看记录直接恢复播放（不走搜索页，直接打开播放器并跳转到上次位置）
async function resumeFromHistory(name) {
  if (!name) return;
  _playerOpen = true;
  // 立即显示加载界面
  document.getElementById('modalBox').innerHTML =
    '<div class="player-area"><div class="player-loading"><div class="spin"></div>正在加载 "'+esc(name)+'" ...</div></div>'
    + '<div class="p-top"><button class="p-back" onclick="closePlayer()">&#8592;</button><span class="p-title">'+esc(name)+'</span></div>';
  document.getElementById('modalMask').classList.add('show');
  document.body.style.overflow = 'hidden';

  // 并发从多个源搜索，收集所有结果后选最佳匹配
  var opened = false;
  var allSources = [...API_SOURCES, ...SHORT_DRAMA_SOURCES];
  var candidates = [];
  var results = await Promise.allSettled(allSources.slice(0, 10).map(async function(src) {
    try {
      var data = await apiFetch(src.api + '?ac=detail&wd=' + encodeURIComponent(name));
      if (data && data.list) {
        var match = bestMatch(data.list, name);
        if (match) {
          return { item: mapVodItem(match, src.name), score: nameMatchScore(match.vod_name, name) };
        }
      }
    } catch(e) {}
    return null;
  }));
  results.forEach(function(r) { if (r.status === 'fulfilled' && r.value) candidates.push(r.value); });
  candidates.sort(function(a, b) { return b.score - a.score; });
  if (candidates.length > 0 && candidates[0].score >= 25) {
    opened = true;
    closePlayer();
    openPlayer(candidates[0].item);
  }

  // 如果前10个源没找到，继续搜索剩余源
  if (!opened && allSources.length > 10) {
    var candidates2 = [];
    var results2 = await Promise.allSettled(allSources.slice(10).map(async function(src) {
      try {
        var data = await apiFetch(src.api + '?ac=detail&wd=' + encodeURIComponent(name));
        if (data && data.list) {
          var match = bestMatch(data.list, name);
          if (match) {
            return { item: mapVodItem(match, src.name), score: nameMatchScore(match.vod_name, name) };
          }
        }
      } catch(e) {}
      return null;
    }));
    results2.forEach(function(r) { if (r.status === 'fulfilled' && r.value) candidates2.push(r.value); });
    candidates2.sort(function(a, b) { return b.score - a.score; });
    if (candidates2.length > 0 && candidates2[0].score >= 25) {
      opened = true;
      closePlayer();
      openPlayer(candidates2[0].item);
    }
  }

  // 如果所有源都没找到，回退到搜索
  if (!opened) {
    closePlayer();
    doSearch(name);
  }
}

function renderFilterBar(catName) {
  const bar = document.getElementById('filterBar');
  const inner = document.getElementById('filterInner');
  if (!catName || catName === '首页' || catName === '短剧' || catName === '排行榜') { bar.classList.remove('show'); return; }
  const genres = FILTER_GENRES[catName] || [];
  const regions = FILTER_REGIONS[catName] || ['全部','大陆','港台','日韩','欧美','其他'];
  function filterRow(label, items, filterKey, getVal, getLabel) {
    var h = '<div class="filter-row"><span class="filter-label">'+label+'</span>';
    items.forEach(function(item) {
      var val = getVal ? getVal(item) : (item === '全部' ? '' : item);
      var text = getLabel ? getLabel(item) : item;
      var isActive = curFilters[filterKey] === val;
      h += '<span class="filter-btn'+(isActive?' active':'')+'" onclick="setFilter(\''+filterKey+'\',\''+val+'\')">'+text+'</span>';
    });
    return h + '</div>';
  }
  let html = '';
  html += filterRow('年份', FILTER_YEARS, 'year');
  html += filterRow('地区', regions, 'region');
  if (genres.length) html += filterRow('类型', genres, 'genre');
  html += filterRow('排序', FILTER_SORT, 'sort', function(s){return s.key;}, function(s){return s.label;});
  // Active filter summary
  const activeFilters = [];
  if (curFilters.year) activeFilters.push({key:'year', label:'年份: '+curFilters.year});
  if (curFilters.region) activeFilters.push({key:'region', label:'地区: '+curFilters.region});
  if (curFilters.genre) activeFilters.push({key:'genre', label:'类型: '+curFilters.genre});
  if (curFilters.sort && curFilters.sort !== 'default') {
    const sl = FILTER_SORT.find(s => s.key === curFilters.sort);
    activeFilters.push({key:'sort', label:'排序: '+(sl?sl.label:'')});
  }
  if (activeFilters.length) {
    html += '<div class="filter-summary">';
    activeFilters.forEach(f => {
      html += '<span class="filter-tag-active" onclick="clearFilter(\''+f.key+'\')">'+f.label+'<span class="tag-x">&times;</span></span>';
    });
    html += '<span class="filter-tag-active" onclick="clearAllFilters()" style="background:rgba(255,100,100,.1);color:#ff8a80;border-color:rgba(255,100,100,.2)">清除全部<span class="tag-x">&times;</span></span>';
    html += '</div>';
  }
  inner.innerHTML = html;
  bar.classList.add('show');
}

function applyFiltersAndRender(catName) {
  const cache = _catCache[catName];
  if (!cache || !cache.data.length) { switchCat(curCat); return; }
  let items = cache.data;
  if (curFilters.year) {
    if (curFilters.year === '更早') {
      items = items.filter(it => { const y = parseInt(it.year); return y && y < 2018; });
    } else {
      items = items.filter(it => (it.year||'').includes(curFilters.year));
    }
  }
  if (curFilters.region) {
    const regionMap = {
      '大陆': ['大陆','内地','中国','国产'],
      '香港': ['香港'],
      '台湾': ['台湾'],
      '港台': ['香港','台湾','港台'],
      '韩国': ['韩国'],
      '日本': ['日本'],
      '日韩': ['日本','韩国','日韩'],
      '美国': ['美国'],
      '英国': ['英国'],
      '欧美': ['美国','英国','欧美','法国','德国','加拿大','澳大利亚'],
      '法国': ['法国'],
      '德国': ['德国'],
      '印度': ['印度'],
      '泰国': ['泰国'],
      '其他': [],
    };
    const aliases = regionMap[curFilters.region] || [curFilters.region];
    if (curFilters.region === '其他') {
      const allKnown = Object.values(regionMap).flat();
      items = items.filter(it => { const area = (it.area||it.type||''); return !allKnown.some(a => area.includes(a)); });
    } else {
      items = items.filter(it => { const area = (it.area||it.type||''); return aliases.some(a => area.includes(a)); });
    }
  }
  if (curFilters.genre) {
    items = items.filter(it => { const t = (it.type||'') + (it.class||'') + (it.desc||''); return t.includes(curFilters.genre); });
  }
  // Apply sorting
  if (curFilters.sort && curFilters.sort !== 'default') {
    items = [...items];
    if (curFilters.sort === 'time') {
      // Keep original order (API returns newest first by default)
    } else if (curFilters.sort === 'name') {
      items.sort((a,b) => (a.name||'').localeCompare(b.name||'', 'zh-CN'));
    } else if (curFilters.sort === 'year') {
      items.sort((a,b) => (parseInt(b.year)||0) - (parseInt(a.year)||0));
    }
  }
  const hp = document.getElementById('homePage');
  const pg = _catPageNum[catName] || 1;
  if (!items.length) {
    hp.innerHTML = '<div class="loading"><div class="spin"></div>正在从API加载 '+catName+' '+curFilters.year+' 数据...</div>';
    fetchFilteredFromApi(catName);
  } else {
    hp.innerHTML = paginatedSectionHTML(catName + '热门', items, pg, catName);
    // Also fetch more from API in background if filtered results are few
    if (items.length < 10) fetchFilteredFromApi(catName);
  }
}

async function fetchFilteredFromApi(catName) {
  const gen = _navGeneration;
  const typeMap = {'电影':'1','电视剧':'2','动漫':'4','综艺':'3'};
  const tid = typeMap[catName]||'';
  const yearParam = curFilters.year && curFilters.year !== '更早' ? '&year=' + curFilters.year : '';
  const allItems = [];
  const seen = new Set();

  // Also try class/area params
  const areaParam = curFilters.region ? '&area=' + encodeURIComponent(curFilters.region) : '';
  const classParam = curFilters.genre ? '&class=' + encodeURIComponent(curFilters.genre) : '';

  const tasks = [];
  for (const src of API_SOURCES.slice(0, 15)) {
    for (const pg of [1, 2, 3, 4, 5]) {
      tasks.push((async () => {
        try {
          const url = src.api + '?ac=detail' + (tid ? '&t=' + tid : '') + yearParam + areaParam + classParam + '&pg=' + pg;
          const data = await apiFetch(url);
          if (data && data.list) return data.list.map(it => mapVodItem(it, src.name));
        } catch(e) {}
        return [];
      })());
    }
  }
  const results = await Promise.all(tasks);
  for (const batch of results) {
    for (const item of batch) {
      if (!item.name || seen.has(item.name)) continue;
      seen.add(item.name);
      allItems.push(item);
    }
  }

  if (gen !== _navGeneration) return; // 用户已切走，丢弃结果

  if (allItems.length > 0) {
    // Merge into cache
    const cache = _catCache[catName];
    if (cache && cache.data) {
      const existingNames = new Set(cache.data.map(it => it.name));
      allItems.forEach(it => { if (!existingNames.has(it.name)) { cache.data.push(it); existingNames.add(it.name); } });
      cache.ts = Date.now();
    }
    // Re-apply filters with new data
    let items = cache ? cache.data : allItems;
    if (curFilters.year) {
      if (curFilters.year === '更早') {
        items = items.filter(it => { const y = parseInt(it.year); return y && y < 2018; });
      } else {
        items = items.filter(it => (it.year||'').includes(curFilters.year));
      }
    }
    if (curFilters.region) {
      const regionMap = {
        '大陆': ['大陆','内地','中国','国产'],
        '香港': ['香港'],
        '台湾': ['台湾'],
        '港台': ['香港','台湾','港台'],
        '韩国': ['韩国'],
        '日本': ['日本'],
        '日韩': ['日本','韩国','日韩'],
        '美国': ['美国'],
        '英国': ['英国'],
        '欧美': ['美国','英国','欧美','法国','德国','加拿大','澳大利亚'],
        '法国': ['法国'],
        '德国': ['德国'],
        '印度': ['印度'],
        '泰国': ['泰国'],
        '其他': [],
      };
      const aliases = regionMap[curFilters.region] || [curFilters.region];
      if (curFilters.region === '其他') {
        const allKnown = Object.values(regionMap).flat();
        items = items.filter(it => { const area = (it.area||it.type||''); return !allKnown.some(a => area.includes(a)); });
      } else {
        items = items.filter(it => { const area = (it.area||it.type||''); return aliases.some(a => area.includes(a)); });
      }
    }
    if (curFilters.genre) {
      items = items.filter(it => { const t = (it.type||'') + (it.class||'') + (it.desc||''); return t.includes(curFilters.genre); });
    }
    // Apply sorting
    if (curFilters.sort && curFilters.sort !== 'default') {
      items = [...items];
      if (curFilters.sort === 'name') items.sort((a,b) => (a.name||'').localeCompare(b.name||'', 'zh-CN'));
      else if (curFilters.sort === 'year') items.sort((a,b) => (parseInt(b.year)||0) - (parseInt(a.year)||0));
    }
    if (gen !== _navGeneration) return; // 用户已切走
    const hp = document.getElementById('homePage');
    if (!items.length) {
      hp.innerHTML = '<div class="empty">当前筛选条件下没有找到内容，请尝试调整筛选</div>';
    } else {
      const pg = _catPageNum[catName] || 1;
      hp.innerHTML = paginatedSectionHTML(catName + '热门', items, pg, catName);
    }
  } else {
    if (gen !== _navGeneration) return; // 用户已切走
    const hp = document.getElementById('homePage');
    if (hp.querySelector('.loading')) {
      hp.innerHTML = '<div class="empty">当前筛选条件下没有找到内容，请尝试调整筛选</div>';
    }
  }
}

function getPlaybackMem() {
  try { return JSON.parse(localStorage.getItem('wyh_playmem')||'{}'); } catch(e) { return {}; }
}
function setPlaybackMem(name, route, epIdx, epName, currentTime) {
  if (!name) return;
  const mem = getPlaybackMem();
  mem[name] = { route, epIdx, epName, ts: Date.now(), time: currentTime || 0 };
  const keys = Object.keys(mem);
  if (keys.length > 200) {
    const sorted = keys.sort((a,b) => (mem[a].ts||0) - (mem[b].ts||0));
    sorted.slice(0, keys.length - 200).forEach(k => delete mem[k]);
  }
  try { localStorage.setItem('wyh_playmem', JSON.stringify(mem)); } catch(e) {}
}
function getPlaybackMemFor(name) {
  const mem = getPlaybackMem();
  return mem[name] || null;
}

// === SEARCH SUGGESTIONS ===
let _suggestTimer = null;
function onSearchInput(val, suggestId) {
  clearTimeout(_suggestTimer);
  const el = document.getElementById(suggestId);
  if (!val || !val.trim()) { 
    // 当输入为空时，隐藏搜索建议/历史记录
    hideSuggest(suggestId);
    return; 
  }
  _suggestTimer = setTimeout(() => buildSuggestions(val.trim(), suggestId), 150);
}

function buildSuggestions(keyword, suggestId) {
  const el = document.getElementById(suggestId);
  const kw = keyword.toLowerCase();
  const suggestions = [];
  const seen = new Set();
  // Generate expanded keywords for better suggestion matching
  const expandedKws = expandKeywords(keyword).map(k => k.toLowerCase());
  function matchesAny(name) {
    const n = name.toLowerCase();
    return expandedKws.some(k => n.includes(k) || k.includes(n));
  }
  getHistory().forEach(h => {
    if (matchesAny(h.name) && !seen.has(h.name)) {
      seen.add(h.name);
      suggestions.push({text: h.name, tag: '历史', icon: '\u{1F550}'});
    }
  });
  Object.values(CURATED_HOT).forEach(arr => {
    arr.forEach(item => {
      if (matchesAny(item.name) && !seen.has(item.name) && suggestions.length < 12) {
        seen.add(item.name);
        suggestions.push({text: item.name, tag: item.type||'', icon: '\u{1F3AC}'});
      }
    });
  });
  HOT_WORDS.forEach(w => {
    if (matchesAny(w) && !seen.has(w) && suggestions.length < 12) {
      seen.add(w);
      suggestions.push({text: w, tag: '热搜', icon: '\u{1F525}'});
    }
  });
  if (!suggestions.length) { el.classList.remove('show'); el.innerHTML = ''; return; }
  el.innerHTML = suggestions.slice(0, 8).map(s => {
    const isHistory = s.tag === '历史';
    const encodedText = encodeURIComponent(s.text);
    const delBtn = isHistory 
      ? `<span class="sg-del" onclick="event.stopPropagation();removeHistoryItem(decodeURIComponent(this.parentElement.getAttribute('data-text')))" title="删除此记录">✕</span>` 
      : '';
    return `<div class="suggest-item" onclick="doSearch(decodeURIComponent(this.getAttribute('data-text')))" data-text="${encodedText}">`
      + `<span class="sg-icon">${s.icon}</span>`
      + `<span class="sg-text">${esc(s.text)}</span>`
      + (s.tag ? `<span class="sg-tag">${esc(s.tag)}</span>` : '')
      + delBtn
      + `</div>`;
  }).join('');
  el.classList.add('show');
}

function onSearchKeydown(e, suggestId) {
  if (e.key === 'Enter') { hideSuggest(suggestId); doSearch(e.target.value); }
  else if (e.key === 'Escape') { hideSuggest(suggestId); }
}

function hideSuggest(id) {
  const el = document.getElementById(id);
  if (el) {
    const inputId = id === 'heroSuggest' ? 'heroInput' : 'inlineInput';
    const activeEl = document.activeElement;
    // 如果焦点仍然在输入框或下拉列表内部（例如正在点击删除按钮），则不隐藏
    if (activeEl && (activeEl.id === inputId || el.contains(activeEl))) {
      return;
    }
    el.classList.remove('show');
  }
}

// === MULTI-SOURCE MERGING ===
async function mergeMultiSources(name) {
  const allRoutes = [];
  const seenSources = new Set();
  _playData.forEach(r => seenSources.add(r.source));
  const promises = API_SOURCES.slice(0, 10).map(async (src) => {
    try {
      const url = src.api + '?ac=detail&wd=' + encodeURIComponent(name);
      const data = await apiFetch(url);
      if (data && data.list) {
        const match = bestMatch(data.list, name) || data.list.find(v => v.vod_name === name);
        if (match && match.vod_play_url) {
          const routes = parsePlayData(match.vod_play_from, match.vod_play_url);
          routes.forEach(route => {
            const routeKey = src.name + ':' + route.source;
            if (!seenSources.has(routeKey)) {
              seenSources.add(routeKey);
              route.source = src.name + ' ' + route.source;
              allRoutes.push(route);
            }
          });
        }
      }
    } catch(e) {}
  });
  await Promise.all(promises);
  if (allRoutes.length > 0) {
    _playData.push(...allRoutes);
    const routeContainer = document.querySelector('.p-controls');
    if (routeContainer) {
      let routePills = _playData.map((s,i) => '<span class="p-pill'+(i===_curRoute?' active':'')+'" onclick="switchRoute('+i+')">'+esc(s.source)+'</span>').join('');
      let routeRow = routeContainer.querySelector('[data-route-row]');
      if (!routeRow) {
        const firstRow = routeContainer.querySelector('.p-row');
        routeRow = document.createElement('div');
        routeRow.className = 'p-row';
        routeRow.setAttribute('data-route-row', '1');
        if (firstRow && firstRow.nextSibling) {
          firstRow.parentNode.insertBefore(routeRow, firstRow.nextSibling);
        } else {
          routeContainer.appendChild(routeRow);
        }
      }
      routeRow.innerHTML = '<span class="p-row-label">资源线路 ('+_playData.length+'个)</span>' + routePills;
    }
    showAutoNextTip('已合并 ' + allRoutes.length + ' 条额外线路');
  }
}

// === SOURCE MANAGEMENT ===
function loadUserSources() {
  try {
    const saved = JSON.parse(localStorage.getItem('wyh_custom_sources')||'null');
    if (saved && saved.apis) {
      saved.apis.forEach(s => { if (!API_SOURCES.find(a => a.api === s.api)) { API_SOURCES.push(s); } });
    }
    if (saved && saved.players) {
      saved.players.forEach(p => { if (!PLAYERS.find(a => a.url === p.url)) { PLAYERS.push(p); } });
    }
    if (saved && saved.removedApis) {
      saved.removedApis.forEach(url => { const idx = API_SOURCES.findIndex(a => a.api === url); if (idx >= 0) API_SOURCES.splice(idx, 1); });
    }
    if (saved && saved.removedPlayers) {
      saved.removedPlayers.forEach(url => { const idx = PLAYERS.findIndex(p => p.url === url); if (idx >= 0) PLAYERS.splice(idx, 1); });
    }
  } catch(e) {}
}

function saveUserSources() {
  const defaultApiUrls = DEFAULT_API_SOURCES.map(s => s.api);
  const defaultPlayerUrls = DEFAULT_PLAYERS.map(p => p.url);
  const customApis = API_SOURCES.filter(s => !defaultApiUrls.includes(s.api));
  const customPlayers = PLAYERS.filter(p => !defaultPlayerUrls.includes(p.url));
  const removedApis = defaultApiUrls.filter(url => !API_SOURCES.find(s => s.api === url));
  const removedPlayers = defaultPlayerUrls.filter(url => !PLAYERS.find(p => p.url === url));
  try { localStorage.setItem('wyh_custom_sources', JSON.stringify({ apis: customApis, players: customPlayers, removedApis, removedPlayers })); } catch(e) {}
}

function addSource(type) {
  if (type === 'api') {
    const name = document.getElementById('newSrcName').value.trim();
    const url = document.getElementById('newSrcUrl').value.trim();
    if (!name || !url) { showAutoNextTip('请输入名称和地址'); return; }

    API_SOURCES.push({name, api: url});
  } else {
    const name = document.getElementById('newPlayerName').value.trim();
    const url = document.getElementById('newPlayerUrl').value.trim();
    if (!name || !url) { showAutoNextTip('请输入名称和地址'); return; }
    if (PLAYERS.find(p => p.url === url)) { showAutoNextTip('该线路已存在'); return; }
    PLAYERS.push({name, url});
  }
  saveUserSources();
  renderSettings();
  showAutoNextTip('添加成功');
}

function removeSource(type, idx) {
  if (type === 'api') { API_SOURCES.splice(idx, 1); } else { PLAYERS.splice(idx, 1); }
  saveUserSources();
  renderSettings();
}

function resetSources() {
  localStorage.removeItem('wyh_custom_sources');
  API_SOURCES.length = 0;
  DEFAULT_API_SOURCES.forEach(s => API_SOURCES.push({...s}));
  PLAYERS.length = 0;
  DEFAULT_PLAYERS.forEach(p => PLAYERS.push({...p}));
  renderSettings();
  showAutoNextTip('已恢复默认设置');
}

  // --- Try to skip 10 seconds (Enhanced for aggressive ad skipping) ---
  function trySkip10s() {
    var iframe = document.querySelector('.player-area iframe');
    if (!iframe) return;
    
    // 1. 尝试直接操作 iframe 内的 video 元素
    try {
      var iDoc = iframe.contentDocument || iframe.contentWindow.document;
      if (iDoc) {
        var videos = iDoc.querySelectorAll('video');
        videos.forEach(function(v) {
          if (v.duration && v.duration > 15) {
            v.currentTime = Math.min(v.currentTime + 10, v.duration - 1);
            if (v.paused) v.play();
          }
        });
        if (videos.length > 0) return;
      }
    } catch(e) {}
    
    // 2. 发送多种 postMessage 尝试跨域控制
    try {
      iframe.contentWindow.postMessage({type:'seekForward',seconds:10}, '*');
      iframe.contentWindow.postMessage({type:'seek',time:10,relative:true}, '*');
      iframe.contentWindow.postMessage('skip10', '*');
      iframe.contentWindow.postMessage({action:'fastForward', value:10}, '*');
    } catch(e) {}

    // 3. 模拟键盘“右键”事件 (连续触发两次，确保绝大多数网页播放器强制快进10秒)
    try {
      var iframeWin = iframe.contentWindow;
      var event = new KeyboardEvent('keydown', {
        key: 'ArrowRight',
        code: 'ArrowRight',
        keyCode: 39,
        which: 39,
        bubbles: true,
        cancelable: true
      });
      iframeWin.document.dispatchEvent(event);
      iframeWin.dispatchEvent(event);
      // 延迟再触发一次，确保生效
      setTimeout(function() {
        iframeWin.document.dispatchEvent(event);
        iframeWin.dispatchEvent(event);
      }, 100);
    } catch(e) {}
  }

  function onWindowBlur() {
    var mask = document.getElementById('modalMask');
    if (!mask || !mask.classList.contains('show')) return;

    _iframeClickCount++;

    setTimeout(function() {

          var iDoc = iframe.contentDocument || iframe.contentWindow.document;
          if (iDoc) {
            var videos = iDoc.querySelectorAll('video');

          }
        }
      } catch(e) {
        // Cross-origin: can't check, use heuristic
        // Show shield anyway as a precaution - user can click to dismiss instantly
        showShield();
        return;
      }
      if (videoPaused) showShield();
    }, 400);

    // Also do a delayed re-scan in case ad appears with a delay
    setTimeout(function() {
      if (!_adGuardActive) return;
      if (_shieldVisible) { scanAndKillAds(); return; }
      var adFound = scanAndKillAds();
      if (adFound) showShield();
    }, 1200);
  }

    // If they focused back some other way, we can hide the shield
  }

  // --- Start the ad guard ---
  function startAdGuard() {
    if (_adGuardActive) return;
    _adGuardActive = true;
    _iframeClickCount = 0;

    window.addEventListener('blur', onWindowBlur);
    window.addEventListener('focus', onWindowFocus);

    // MutationObserver: watch for new ad-like nodes inserted into the document
    _adGuardObserver = new MutationObserver(function(mutations) {
      var mask = document.getElementById('modalMask');
      if (!mask || !mask.classList.contains('show')) return;
      var now = Date.now();
      var adDetected = false;
      mutations.forEach(function(mut) {
        mut.addedNodes.forEach(function(node) {
          if (node.nodeType !== 1) return;
          if (isSafeElement(node)) return;
          // Check the node itself
          if (isLikelyAd(node)) {
            node.style.display = 'none';
            node.style.visibility = 'hidden';
            node.style.pointerEvents = 'none';
            adDetected = true;
          }
          // Check children
          if (node.querySelectorAll) {
            node.querySelectorAll('div,a,iframe,img,span,section').forEach(function(child) {
              if (!isSafeElement(child) && isLikelyAd(child)) {
                child.style.display = 'none';
                child.style.visibility = 'hidden';
                adDetected = true;
              }
            });
          }
          // Rogue iframes
          if (node.tagName === 'IFRAME' && !isSafeElement(node)) {
            node.remove();
            adDetected = true;
          }
        });
      });
      if (adDetected) {
        if (_shieldVisible) {
          // Already showing shield, just keep killing ads
        } else {
          // Mid-video ad: try to skip
          if (now - _lastAdSkipTime > 12000) {
            _lastAdSkipTime = now;
            trySkip10s();
            showAdGuardTip('\u68C0\u6D4B\u5230\u5E7F\u544A\uFF0C\u5DF2\u5C1D\u8BD5\u8DF3\u8FC710\u79D2');
          }
        }
      }
    });

    _adScanTimer = setInterval(function() {
      var mask = document.getElementById('modalMask');

      scanAndKillAds();

      try {
        var iframe = document.querySelector('.player-area iframe');
        if (!iframe) return;
        var iDoc = iframe.contentDocument || iframe.contentWindow.document;
        if (iDoc) {
          iDoc.querySelectorAll('video').forEach(function(v) {
            if (!v._adGuardBound) {
              v._adGuardBound = true;
              v.addEventListener('pause', function() {
                setTimeout(function() {
                  if (v.paused && !v.ended && v.currentTime > 0) showShield();
                }, 350);
              });
              v.addEventListener('play', function() { hideShield(); });
              v.addEventListener('playing', function() { hideShield(); });
            }
          });
        }
      } catch(e) {} // cross-origin, ignore
    }, 1500);
  }

  function stopAdGuard() {
    _adGuardActive = false;
    window.removeEventListener('blur', onWindowBlur);
    window.removeEventListener('focus', onWindowFocus);
    if (_adGuardObserver) { _adGuardObserver.disconnect(); _adGuardObserver = null; }
    if (_adScanTimer) { clearInterval(_adScanTimer); _adScanTimer = null; }
    if (_blurScanTimer) { clearTimeout(_blurScanTimer); _blurScanTimer = null; }

  }

  window.addEventListener('message', function(e) {

        if (data === 'play' || data === 'playing' || data === 'resume') { hideShield(); return; }

      if (!data || typeof data !== 'object') return;
      var evtType = (data.type || data.event || data.msg || data.action || data.name || '').toLowerCase();
      if (evtType === 'pause' || evtType === 'paused') { setTimeout(showShield, 300); }
      if (evtType === 'play' || evtType === 'playing' || evtType === 'resume') { hideShield(); }
    } catch(ex) {}
  });

  // --- Hook into openPlayer / closePlayer ---
  var _origOpen = window.openPlayer;
  window.openPlayer = function() { _origOpen.apply(this, arguments); setTimeout(startAdGuard, 500); };
  var _origClose = window.closePlayer;
  window.closePlayer = function() { stopAdGuard(); _origClose.apply(this, arguments); };
})();

    + '</div>';

function initDirectPlayer(url) {
  destroyHls();
  _currentM3u8Url = url;
  const video = document.getElementById('dpVideo');
  if(!video) return;
  _hlsVideo = video;

  // Inject controls into modalBox (outside player-area overflow:hidden)
  injectDPControls();

  // Check if it's an m3u8 URL
  const isM3u8 = /\.m3u8/i.test(url) || /m3u8/i.test(url);

  // 通用播放尝试函数：处理 autoplay 策略限制
  function tryPlay() {
    var p = video.play();
    if (p && p.then) {
      p.then(function() {
        // 播放成功后立即取消静音
        setTimeout(function() { video.muted = false; }, 300);
      }).catch(function(err) {
        if (err.name === 'NotAllowedError') {
          video.muted = true;
          video.play().then(function() {
            setTimeout(function() { video.muted = false; }, 800);
          }).catch(function(){});
        }
      });
    }
  }

  // 网络失败自动回退到iframe模式
  var _autoFallbackTimeout = null;
  function _autoFallbackToIframe() {
    if (_autoFallbackTimeout) { clearTimeout(_autoFallbackTimeout); _autoFallbackTimeout = null; }
    console.log('[直连] 加载失败，自动回退到iframe模式');
    var savedUrl = _currentM3u8Url;
    // 不永久改变设置，只临时用iframe播放当前集
    destroyHls();
    var pa = document.getElementById('playerArea');
    if (pa && savedUrl) {
      pa.innerHTML = _origPlayerIframe(savedUrl);
      // 重建检测层，确保UI自动隐藏系统继续工作
      if (_playerUIActive) {
        _ensureDetectOverlay();
        _showPlayerUI();
      }
    }
  }

  function _createHls(sourceUrl) {
    if (_hlsInstance) { try { _hlsInstance.destroy(); } catch(e){} _hlsInstance = null; }

    var hls = new Hls({
      // === 秒开极速策略（优化版） ===
      maxBufferLength: 15,             // 15秒起播缓冲，平衡速度和流畅度
      maxMaxBufferLength: 300,         // 播放后逐步缓冲到300秒
      maxBufferSize: 120 * 1024 * 1024,
      maxBufferHole: 0.8,             // 容忍更大的buffer空洞，避免卡住
      highBufferWatchdogPeriod: 2,
      nudgeOffset: 0.3,
      nudgeMaxRetry: 10,
      enableWorker: true,
      lowLatencyMode: true,            // 低延迟模式，更快拉取分片
      startLevel: -1,                  // 自动选择清晰度，快速连接时直接高清
      abrEwmaDefaultEstimate: 3000000, // 3Mbps带宽估计，适合大多数网络
      abrBandWidthFactor: 0.7,
      abrBandWidthUpFactor: 0.7,
      fragLoadingTimeOut: 8000,
      fragLoadingMaxRetry: 4,
      fragLoadingRetryDelay: 200,      // 更快重试
      manifestLoadingTimeOut: 6000,    // manifest超时缩短
      manifestLoadingMaxRetry: 3,
      manifestLoadingRetryDelay: 200,
      levelLoadingTimeOut: 6000,
      levelLoadingMaxRetry: 3,
      levelLoadingRetryDelay: 200,
      startFragPrefetch: true,         // 预取首个分片
      testBandwidth: true,
      progressive: true,
      backBufferLength: 90,
      maxFragLookUpTolerance: 0.25,
      appendErrorMaxRetry: 5,
      stretchShortVideoTrack: true,    // 处理短分片
      // 关键：自定义XHR设置
      xhrSetup: function(xhr, xhrUrl) {
        xhr.timeout = 10000;
      }
    });
    _hlsInstance = hls;
    hls.loadSource(sourceUrl);
    hls.attachMedia(video);

    // 设置6秒超时：如果6秒内没有解析到manifest就回退iframe
    _autoFallbackTimeout = setTimeout(function() {
      if (_hlsInstance === hls && video.readyState < 2) {
        _autoFallbackToIframe();
      }
    }, 6000);

    hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
      if (_autoFallbackTimeout) { clearTimeout(_autoFallbackTimeout); _autoFallbackTimeout = null; }
      tryPlay();
      // 播放后放宽缓冲限制让体验更流畅
      setTimeout(function() {
        if (hls && hls.config) {
          hls.config.maxBufferLength = 60;
        }
      }, 3000);
    });

    var _hlsNetRetry = 0;
    var _hlsMediaRetry = 0;
    hls.on(Hls.Events.ERROR, function(event, data) {
      if (!data.fatal) return;
      // 记住当前播放位置，防止恢复后从头播放
      var savedPos = video.currentTime || 0;
      var wasPlaying = !video.paused;
      switch(data.type) {
        case Hls.ErrorTypes.NETWORK_ERROR:
          _hlsNetRetry++;
          if (_hlsNetRetry <= 2) {
            hls.startLoad(savedPos);
          } else {
            _autoFallbackToIframe();
          }
          break;
        case Hls.ErrorTypes.MEDIA_ERROR:
          _hlsMediaRetry++;
          if (_hlsMediaRetry <= 3) {
            hls.recoverMediaError();
            // recoverMediaError可能重置播放位置，恢复之
            setTimeout(function() {
              if (video && savedPos > 1 && Math.abs(video.currentTime - savedPos) > 3) {
                video.currentTime = savedPos;
              }
              if (wasPlaying && video.paused) video.play();
            }, 300);
          } else {
            _autoFallbackToIframe();
          }
          break;
        default:
          _autoFallbackToIframe();
          break;
      }
    });
  }

  if(isM3u8 && typeof Hls !== 'undefined' && Hls.isSupported()) {
    _createHls(url);
  } else if(isM3u8 && video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari native HLS
    video.src = url;
    tryPlay();
  } else if(!isM3u8) {
    // Direct mp4/other format
    video.src = url;
    tryPlay();
  } else {
    showDPError('浏览器不支持HLS直连，请使用iframe模式');
    return;
  }

  // Setup controls interaction
  setupDPControls(video);
  startDPUpdate(video);

  // 直连模式：直接在video元素上监听鼠标/触摸，确保UI能正常显示
  video.addEventListener('mousemove', function() {
    if (_playerUIActive) _showPlayerUI();
  });
  video.addEventListener('touchstart', function() {
    if (_playerUIActive) _showPlayerUI();
  }, {passive:true});
  video.addEventListener('click', function() {
    if (_playerUIActive) _showPlayerUI();
  });

  // 加速起播
  video.addEventListener('canplay', function _onCanPlay() {
    tryPlay();
    video.removeEventListener('canplay', _onCanPlay);
  }, { once: true });

  // 防止画面冻结 — 只在确认当前位置有效时恢复
  video.addEventListener('stalled', function() {
    var pos = video.currentTime;
    if (_hlsInstance && pos > 0) _hlsInstance.startLoad(pos);
    setTimeout(function() {
      // 确保没有跳回开头
      if (video.paused && video.readyState >= 2 && Math.abs(video.currentTime - pos) < 2) {
        video.play();
      }
    }, 800);
  });

  // 卡住超过2秒恢复加载 — 保持在当前位置
  var _waitingTimer = null;
  video.addEventListener('waiting', function() {
    if (_waitingTimer) clearTimeout(_waitingTimer);
    var pos = video.currentTime;
    _waitingTimer = setTimeout(function() {
      if (_hlsInstance && pos > 0) _hlsInstance.startLoad(pos);
    }, 2000);
  });
  video.addEventListener('playing', function() {
    if (_waitingTimer) { clearTimeout(_waitingTimer); _waitingTimer = null; }
  });

  // Restore saved playback time
  if (window._pendingSavedTime && window._pendingSavedTime > 5) {
    seekToSavedTime(video, window._pendingSavedTime);
    window._pendingSavedTime = 0;
  }

  // Seek时立即从新位置加载
  video.addEventListener('seeking', function(){
    if(_hlsInstance) _hlsInstance.startLoad(video.currentTime);
  });
}

function showDPError(msg) {
